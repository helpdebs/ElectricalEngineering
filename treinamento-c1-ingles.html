<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English C1 — Revisão Gamificada | Teacher Debs</title>
<style>
:root{
  --bg:#f4f4fb; --surface:#ffffff; --surface-2:#eeeef7; --surface-3:#e6e6f2;
  --line:#e0e0ee; --line-2:#d2d2e4;
  --text:#191830; --text-dim:#565477; --text-faint:#8a89a8;
  --shadow:0 1px 2px rgba(30,28,70,.06),0 8px 28px rgba(30,28,70,.07);
  --shadow-lg:0 12px 48px rgba(30,28,70,.16);
  --ok:#1f9d6b; --ok-bg:#e2f6ed; --err:#d63a5b; --err-bg:#fce6ec;
  /* per-level accents */
  --a1:#e8930f; --a1-soft:#fbeccd; --a1-ink:#7a4c00;
  --a2:#d83a5a; --a2-soft:#fadbe2; --a2-ink:#7d1226;
  --a3:#12a074; --a3-soft:#d3f2e7; --a3-ink:#0a5741;
  --a4:#5a6bf0; --a4-soft:#e0e3fd; --a4-ink:#26307e;
  --accent:var(--a1); --accent-soft:var(--a1-soft); --accent-ink:var(--a1-ink);
  --radius:16px; --radius-s:10px;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d0c1a; --surface:#161528; --surface-2:#1f1d36; --surface-3:#282544;
    --line:#2c2a48; --line-2:#3a3760;
    --text:#ecebf7; --text-dim:#a9a7c8; --text-faint:#726f97;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35);
    --shadow-lg:0 16px 56px rgba(0,0,0,.5);
    --ok:#3fd39a; --ok-bg:#122e26; --err:#f37088; --err-bg:#331522;
    --a1:#f5ad3d; --a1-soft:#3a2a0c; --a1-ink:#f9cd7e;
    --a2:#f26482; --a2-soft:#39121f; --a2-ink:#f8a3b4;
    --a3:#33cd98; --a3-soft:#0c3327; --a3-ink:#7fe6c4;
    --a4:#8b98f8; --a4-soft:#1e2150; --a4-ink:#b8c0fb;
  }
}
:root[data-theme="light"]{
  --bg:#f4f4fb; --surface:#ffffff; --surface-2:#eeeef7; --surface-3:#e6e6f2;
  --line:#e0e0ee; --line-2:#d2d2e4; --text:#191830; --text-dim:#565477; --text-faint:#8a89a8;
  --shadow:0 1px 2px rgba(30,28,70,.06),0 8px 28px rgba(30,28,70,.07);
  --shadow-lg:0 12px 48px rgba(30,28,70,.16);
  --ok:#1f9d6b; --ok-bg:#e2f6ed; --err:#d63a5b; --err-bg:#fce6ec;
  --a1:#e8930f; --a1-soft:#fbeccd; --a1-ink:#7a4c00;
  --a2:#d83a5a; --a2-soft:#fadbe2; --a2-ink:#7d1226;
  --a3:#12a074; --a3-soft:#d3f2e7; --a3-ink:#0a5741;
  --a4:#5a6bf0; --a4-soft:#e0e3fd; --a4-ink:#26307e;
}
:root[data-theme="dark"]{
  --bg:#0d0c1a; --surface:#161528; --surface-2:#1f1d36; --surface-3:#282544;
  --line:#2c2a48; --line-2:#3a3760; --text:#ecebf7; --text-dim:#a9a7c8; --text-faint:#726f97;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35);
  --shadow-lg:0 16px 56px rgba(0,0,0,.5);
  --ok:#3fd39a; --ok-bg:#122e26; --err:#f37088; --err-bg:#331522;
  --a1:#f5ad3d; --a1-soft:#3a2a0c; --a1-ink:#f9cd7e;
  --a2:#f26482; --a2-soft:#39121f; --a2-ink:#f8a3b4;
  --a3:#33cd98; --a3-soft:#0c3327; --a3-ink:#7fe6c4;
  --a4:#8b98f8; --a4-soft:#1e2150; --a4-ink:#b8c0fb;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);font-family:var(--sans);
  line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  background-image:radial-gradient(1100px 600px at 85% -8%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 70%);
  background-attachment:fixed;transition:background-color .3s;
}
.wrap{max-width:760px;margin:0 auto;padding:0 18px 80px}
h1,h2,h3{line-height:1.15;font-weight:800;letter-spacing:-.02em;text-wrap:balance;margin:0}
p{margin:0}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- HUD ---------- */
.hud{
  position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.hud-inner{max-width:760px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px}
.brandmark{font-weight:800;letter-spacing:-.03em;font-size:15px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brandmark .dotgrad{width:15px;height:15px;border-radius:5px;background:conic-gradient(from 140deg,var(--a1),var(--a2),var(--a4),var(--a3),var(--a1))}
.hud-stats{margin-left:auto;display:flex;align-items:center;gap:14px;font-family:var(--mono)}
.stat{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.stat b{color:var(--accent-ink)}
.iconbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:15px;transition:.15s}
.iconbtn:hover{background:var(--surface-2);border-color:var(--line-2)}
.xptrack{height:5px;background:var(--surface-3);border-radius:99px;overflow:hidden}
.xptrack-inner{max-width:760px;margin:0 auto;padding:0 18px 8px}
.xpfill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#fff));transition:width .5s cubic-bezier(.4,1.2,.4,1)}

/* ---------- Level rail ---------- */
.rail{display:flex;gap:8px;margin:18px 0 6px}
.railseg{flex:1;display:flex;flex-direction:column;gap:6px;align-items:center;opacity:.5;transition:.25s}
.railseg.active,.railseg.done{opacity:1}
.railseg .bar{height:6px;width:100%;border-radius:99px;background:var(--surface-3)}
.railseg.active .bar{background:var(--seg)}
.railseg.done .bar{background:color-mix(in srgb,var(--seg) 60%,var(--surface-3))}
.railseg .lbl{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-faint);font-family:var(--mono)}
.railseg.active .lbl{color:var(--text)}

/* ---------- Cards / screens ---------- */
.screen{animation:rise .4s cubic-bezier(.2,.8,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px 24px;margin-top:20px}
.eyebrow{font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink);display:flex;align-items:center;gap:8px}
.eyebrow::before{content:"";width:22px;height:2px;background:var(--accent);border-radius:2px}

/* ---------- Hero ---------- */
.hero{text-align:center;padding-top:34px}
.hero .kicker{font-family:var(--mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--text-dim);font-weight:700}
.hero h1{font-size:clamp(34px,8vw,58px);margin:14px 0 6px;background:linear-gradient(115deg,var(--a1),var(--a2) 38%,var(--a4) 68%,var(--a3));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lead{color:var(--text-dim);font-size:17px;max-width:52ch;margin:10px auto 0}
.levelgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:26px 0}
.lvcard{text-align:left;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:16px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.lvcard::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--lc)}
.lvcard .n{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--lc)}
.lvcard h3{font-size:16px;margin:3px 0 4px}
.lvcard p{font-size:13px;color:var(--text-dim);line-height:1.45}
.lvcard .lock{position:absolute;top:14px;right:14px;font-size:14px;opacity:.5}
.chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:8px}
.chip{font-size:12px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);color:var(--text-dim);padding:5px 11px;border-radius:99px}

/* ---------- Buttons ---------- */
.btn{background:var(--accent);color:#fff;border-radius:12px;padding:14px 26px;font-size:16px;font-weight:700;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 34%,transparent);transition:transform .12s,box-shadow .2s,filter .2s}
:root[data-theme="dark"] .btn,@media (prefers-color-scheme:dark){.btn{color:#0d0c1a}}
.btn:hover{filter:brightness(1.05);box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 44%,transparent)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn-ghost{background:var(--surface);color:var(--text);border:1px solid var(--line-2);box-shadow:none;font-weight:600;font-size:14px;padding:11px 18px}
.btn-ghost:hover{background:var(--surface-2)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:20px}

/* ---------- Conversation mockups ---------- */
.convo{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface-2);margin:4px 0 18px}
.convo-head{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--surface-3);border-bottom:1px solid var(--line)}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;flex:none}
.convo-head .meta{line-height:1.2;min-width:0}
.convo-head .meta .nm{font-weight:700;font-size:14px}
.convo-head .meta .sub{font-size:11.5px;color:var(--text-faint);font-family:var(--mono)}
.convo-head .app{margin-left:auto;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);font-family:var(--mono)}
.convo-body{padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:82%;padding:9px 13px;border-radius:15px;font-size:14.5px;line-height:1.45;position:relative}
.msg .who{display:block;font-size:11px;font-weight:800;margin-bottom:2px;opacity:.85}
.msg.them{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.you{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:5px}
:root[data-theme="dark"] .msg.you{color:#0d0c1a}
@media (prefers-color-scheme:dark){.msg.you{color:#0d0c1a}}
.msg .blank{display:inline-block;min-width:70px;border-bottom:2px dashed currentColor;opacity:.7;margin:0 2px}
/* post / comment / forum */
.post{padding:14px}
.post .ptop{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.post .ptitle{font-weight:800;font-size:16px;margin-bottom:4px;letter-spacing:-.01em}
.post .pbody{font-size:14.5px;color:var(--text);line-height:1.5}
.post .pmeta{font-family:var(--mono);font-size:11px;color:var(--text-faint);margin-top:8px;display:flex;gap:14px}
.comment{display:flex;gap:10px;padding:11px 14px;border-top:1px solid var(--line)}
.comment .cbody{font-size:14px;line-height:1.45}
.comment .cby{font-weight:700;font-size:12.5px;margin-bottom:2px}
.comment .cby span{color:var(--text-faint);font-weight:500;font-family:var(--mono);font-size:11px;margin-left:6px}

/* ---------- Voice note (listening) ---------- */
.voicenote{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:4px 0 14px}
.playbtn{width:46px;height:46px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none;font-size:17px;transition:transform .12s,filter .2s}
:root[data-theme="dark"] .playbtn{color:#0d0c1a}
@media (prefers-color-scheme:dark){.playbtn{color:#0d0c1a}}
.playbtn:hover{filter:brightness(1.06)}
.playbtn.playing{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 45%,transparent)}50%{box-shadow:0 0 0 9px transparent}}
.wave{display:flex;align-items:center;gap:3px;flex:1;height:30px}
.wave i{width:3px;border-radius:2px;background:color-mix(in srgb,var(--accent) 60%,var(--text-faint));height:30%}
.playbtn.playing~.wave i{animation:eq .9s ease-in-out infinite}
@keyframes eq{0%,100%{height:25%}50%{height:95%}}
.vn-meta{font-family:var(--mono);font-size:11px;color:var(--text-faint);flex:none}
.transcript{font-size:13.5px;color:var(--text-dim);background:var(--surface-2);border:1px dashed var(--line-2);border-radius:10px;padding:10px 13px;margin:-6px 0 14px}
.transcript b{color:var(--text);font-weight:700}

/* ---------- Options ---------- */
.qtext{font-size:17px;font-weight:700;margin:6px 0 14px;letter-spacing:-.01em}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:13px 15px;font-size:15px;transition:border-color .15s,background .15s,transform .1s}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:active:not(:disabled){transform:scale(.995)}
.opt .key{width:24px;height:24px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);font-family:var(--mono);font-weight:700;font-size:13px;display:grid;place-items:center;flex:none;margin-top:1px}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.correct .key{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{border-color:var(--err);background:var(--err-bg)}
.opt.wrong .key{background:var(--err);color:#fff;border-color:var(--err)}
.opt:disabled{cursor:default}
.opt.dim{opacity:.5}

/* ---------- Feedback ---------- */
.fb{border-radius:12px;padding:13px 15px;margin-top:16px;font-size:14.5px;line-height:1.5;border:1px solid;animation:rise .3s both}
.fb.good{background:var(--ok-bg);border-color:color-mix(in srgb,var(--ok) 40%,transparent);color:var(--text)}
.fb.bad{background:var(--err-bg);border-color:color-mix(in srgb,var(--err) 40%,transparent);color:var(--text)}
.fb .fbh{font-weight:800;display:flex;align-items:center;gap:7px;margin-bottom:3px}
.fb.good .fbh{color:var(--ok)}
.fb.bad .fbh{color:var(--err)}

/* ---------- Writing task ---------- */
textarea{width:100%;min-height:110px;resize:vertical;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:13px 15px;font-family:inherit;font-size:15px;color:var(--text);line-height:1.5}
textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.wcount{font-family:var(--mono);font-size:12px;color:var(--text-faint);text-align:right;margin-top:5px}
.targets{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.tgt{font-size:12.5px;font-weight:600;padding:6px 11px 6px 9px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);color:var(--text-dim);display:flex;align-items:center;gap:6px;transition:.2s}
.tgt .mk{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;font-size:10px;flex:none}
.tgt.hit{border-color:var(--ok);background:var(--ok-bg);color:var(--text)}
.tgt.hit .mk{background:var(--ok);border-color:var(--ok);color:#fff}
.model{margin-top:14px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 12px 12px 0;padding:13px 16px}
.model .mh{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);font-family:var(--mono);margin-bottom:5px}
.model p{font-size:14.5px;line-height:1.55;font-style:italic}

/* ---------- Level complete / badge ---------- */
.badge-pop{text-align:center;padding:12px 0}
.medal{width:112px;height:112px;margin:6px auto 14px;border-radius:50%;display:grid;place-items:center;font-size:52px;background:radial-gradient(circle at 34% 28%,color-mix(in srgb,var(--accent) 30%,var(--surface)),var(--surface));border:3px solid var(--accent);box-shadow:0 0 0 6px var(--accent-soft),var(--shadow-lg);animation:medalin .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes medalin{from{transform:scale(.3) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}
.scoreline{display:flex;justify-content:center;gap:26px;margin:18px 0;font-family:var(--mono)}
.scoreline .sc{text-align:center}
.scoreline .sc b{display:block;font-size:26px;font-weight:800;color:var(--accent-ink)}
.scoreline .sc span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint)}

/* ---------- Certificate ---------- */
.cert{background:var(--surface);border:2px solid var(--accent);border-radius:20px;padding:30px 26px;text-align:center;box-shadow:var(--shadow-lg);position:relative;overflow:hidden}
.cert::before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent,color-mix(in srgb,var(--accent) 8%,transparent),transparent 40%);animation:spin 14s linear infinite}
@media (prefers-reduced-motion:reduce){.cert::before{animation:none}*{animation-duration:.001ms!important;animation-iteration-count:1!important}}
@keyframes spin{to{transform:rotate(360deg)}}
.cert>*{position:relative}
.rank{font-size:clamp(24px,6vw,36px);margin:10px 0;background:linear-gradient(115deg,var(--a1),var(--a2) 40%,var(--a4) 70%,var(--a3));-webkit-background-clip:text;background-clip:text;color:transparent}
.badgewall{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:18px 0}
.bw{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 14px;display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700}
.bw .em{font-size:22px}
.mini{font-size:13px;color:var(--text-dim)}
.foot{text-align:center;color:var(--text-faint);font-size:12.5px;margin-top:30px;font-family:var(--mono)}
.foot a{color:var(--accent-ink)}
@media (max-width:520px){.levelgrid{grid-template-columns:1fr}.scoreline{gap:18px}.card{padding:22px 17px}}
</style>
</head>
<body>
<div class="hud">
  <div class="hud-inner">
    <div class="brandmark"><span class="dotgrad"></span>English C1 · Review</div>
    <div class="hud-stats">
      <div class="stat" title="Streak — acertos seguidos">🔥<b id="hStreak">0</b></div>
      <div class="stat" title="Experiência acumulada">⭐<b id="hXp">0</b><span style="color:var(--text-faint)">xp</span></div>
      <button class="iconbtn" id="hTheme" title="Alternar tema" aria-label="Alternar tema">◑</button>
    </div>
  </div>
  <div class="xptrack-inner"><div class="xptrack"><div class="xpfill" id="hFill"></div></div></div>
</div>

<main class="wrap" id="app"></main>

<script>
"use strict";
/* =========================================================
   ENGLISH C1 — GAMIFIED REVIEW  (Teacher Debs)
   4 níveis · MCQ + Listening + Discursivo · foco em conversas online
   ========================================================= */

const LEVELS = [
/* ================= LEVEL 1 ================= */
{
  id:1, key:"a1", seg:"var(--a1)", name:"O Grupo de Séries",
  tag:"Phrasal Verbs · Séries & Entretenimento",
  intro:"Você entrou num grupo cheio de fãs de série. Reative os phrasal verbs da Aula 1 — <b>catch up on, switch over, give up on, look forward to, come out, end up, find out, figure out</b> — em DMs, comentários e áudios reais.",
  badge:{em:"📺",name:"Binge-Watcher"},
  tasks:[
    { type:"mcq",
      convo:{kind:"group",app:"Group chat",head:{nm:"Séries Squad",sub:"14 membros · online",av:"S",c:"var(--a1)"},
        items:[
          {who:"them",name:"Marina",t:"gente sem spoiler 😭 ainda não vi o final da season"},
          {who:"them",name:"Léo",t:"relaxa, ninguém vai contar nada"},
          {who:"you",t:"Take your time — you can <span class='blank'></span> the last two episodes this weekend."}
        ]},
      q:"Complete a sua mensagem com o phrasal verb correto.",
      opts:[{t:"catch up on",ok:true},{t:"switch over",ok:false},{t:"give up on",ok:false},{t:"come out",ok:false}],
      fb:"<b>catch up on</b> = assistir os episódios que você perdeu / colocar o atraso em dia. As outras não combinam: <i>switch over</i> (trocar de canal/app), <i>give up on</i> (desistir), <i>come out</i> (ser lançado)."

/* ---------- THEME ---------- */
const rootEl=document.documentElement;
(function initTheme(){
  const saved=localStorage.getItem("c1theme");
  if(saved)rootEl.setAttribute("data-theme",saved);
})();
document.getElementById("hTheme").onclick=()=>{
  const cur=rootEl.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
  const next=cur==="dark"?"light":"dark";
  rootEl.setAttribute("data-theme",next);localStorage.setItem("c1theme",next);
};

/* ---------- HUD ---------- */
function setAccent(key){
  const map={a1:["--a1","--a1-soft","--a1-ink"],a2:["--a2","--a2-soft","--a2-ink"],a3:["--a3","--a3-soft","--a3-ink"],a4:["--a4","--a4-soft","--a4-ink"]};
  const m=map[key]||map.a1;
  rootEl.style.setProperty("--accent","var("+m[0]+")");
  rootEl.style.setProperty("--accent-soft","var("+m[1]+")");
  rootEl.style.setProperty("--accent-ink","var("+m[2]+")");
}
function updHud(){
  document.getElementById("hXp").textContent=S.xp;
  document.getElementById("hStreak").textContent=S.streak;
  document.getElementById("hFill").style.width=Math.min(100,(S.xp/MAXXP)*100)+"%";
}
function addXp(n){S.xp+=n;if(S.streak>S.best)S.best=S.streak;save();updHud();}

/* ---------- HELPERS ---------- */
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function avatarHTML(c,letter){return `<div class="avatar" style="background:${c}">${letter}</div>`;}

function convoHTML(cv){
  if(!cv)return "";
  let inner="";
  if(cv.kind==="group"||cv.kind==="dm"||cv.kind==="tweet"){
    inner=`<div class="convo-head">${avatarHTML(cv.head.c,cv.head.av)}<div class="meta"><div class="nm">${esc(cv.head.nm)}</div><div class="sub">${esc(cv.head.sub)}</div></div><div class="app">${esc(cv.app)}</div></div><div class="convo-body">`;
    cv.items.forEach(m=>{
      const nm=(cv.kind!=="dm"&&m.who==="them"&&m.name)?`<span class="who">${esc(m.name)}</span>`:"";
      inner+=`<div class="msg ${m.who}">${nm}${m.t}</div>`;
    });
    inner+=`</div>`;
  }else if(cv.kind==="forum"){
    inner=`<div class="convo-head"><div class="app" style="margin-left:0">▲ ${esc(cv.app)}</div></div><div class="post"><div class="ptitle">${esc(cv.title)}</div><div class="pbody">${esc(cv.body)}</div><div class="pmeta"><span>${esc(cv.author)}</span>${cv.meta.map(x=>`<span>${esc(x)}</span>`).join("")}</div></div>`;
  }else if(cv.kind==="comment"){
    const p=cv.post;
    inner=`<div class="convo-head"><div class="app" style="margin-left:0">💬 ${esc(cv.app)}</div></div><div class="post"><div class="ptop">${avatarHTML(p.c,p.av)}<div><div class="ptitle" style="font-size:14px">${esc(p.nm)} <span style="color:var(--text-faint);font-weight:500;font-size:12px">· ${esc(p.time)}</span></div></div></div><div class="pbody">${esc(p.body)}</div></div>`;
    (cv.comments||[]).forEach(c=>{
      inner+=`<div class="comment">${avatarHTML("var(--text-faint)",c.by[1]?c.by[1].toUpperCase():"?")}<div><div class="cby">${esc(c.by)}<span>${esc(c.time)}</span></div><div class="cbody">${esc(c.t)}</div></div></div>`;
    });
  }
  return `<div class="convo">${inner}</div>`;
}

/* ---------- RENDER ROOT ---------- */
const app=document.getElementById("app");
function render(html){app.innerHTML=html;window.scrollTo({top:0,behavior:"smooth"});}

/* ---------- HOME ---------- */
function home(){
  setAccent("a1");updHud();
  const done=Object.keys(S.levelDone).length;
  const startedLabel=done>0||S.xp>0?"Continuar treino":"Começar treino";
  let cards="";
  LEVELS.forEach(l=>{
    const unlocked=l.id<=S.unlocked;
    const isDone=S.levelDone[l.id];
    cards+=`<button class="lvcard" style="--lc:var(--${l.key})" ${unlocked?"":"disabled"} onclick="${unlocked?`goLevel(${l.id})`:""}">
      ${unlocked?"":'<span class="lock">🔒</span>'}${isDone?'<span class="lock">✅</span>':""}
      <div class="n">NÍVEL ${l.id}${l.id===4?" · BOSS":""}</div>
      <h3>${esc(l.name)}</h3><p>${esc(l.tag)}</p></button>`;
  });
  render(`<div class="screen hero">
    <div class="kicker">Teacher Debs · Revisão de 4 aulas</div>
    <h1>English C1<br>Review Quest</h1>
    <p class="lead">Um treino gamificado que revisa <b>tudo o que vimos em aula</b> — phrasal verbs, vocabulário de crime & opinião, dilemas do dia a dia e linguagem de percepção — aplicado a conversas reais da internet.</p>
    <div class="chips"><span class="chip">📱 DMs & grupos</span><span class="chip">💬 Comentários</span><span class="chip">▲ Fóruns</span><span class="chip">🎧 Listening ativo</span><span class="chip">✍️ Discursivas</span></div>
    <div class="levelgrid">${cards}</div>
    <button class="btn" onclick="goLevel(${Math.min(S.unlocked,4)})">${startedLabel} →</button>
    <div class="foot">Progresso salvo automaticamente · <a href="#" onclick="resetAll();return false;">recomeçar do zero</a></div>
  </div>`);
}
window.resetAll=function(){
  if(confirm("Apagar todo o progresso e recomeçar?")){S={xp:0,streak:0,best:0,unlocked:1,levelDone:{},current:null,ti:0,answered:{}};save();home();}
};

/* ---------- LEVEL INTRO ---------- */
window.goLevel=function(id){
  const l=LEVELS.find(x=>x.id===id);S.current=id;S.ti=0;save();setAccent(l.key);updHud();
  render(`<div class="screen">
    <div class="card">
      <div class="eyebrow">Nível ${l.id}${l.id===4?" · Boss":""} — ${esc(l.tag)}</div>
      <h1 style="font-size:30px;margin:10px 0 12px">${esc(l.name)}</h1>
      <p style="color:var(--text-dim);font-size:15.5px;line-height:1.6">${l.intro}</p>
      <div class="chips" style="justify-content:flex-start;margin-top:16px">
        <span class="chip">${l.tasks.length} tarefas</span>
        <span class="chip">MCQ + Listening + Discursiva</span>
        <span class="chip">🏅 ${esc(l.badge.name)}</span>
      </div>
      <div class="btnrow"><button class="btn" onclick="task(0)">Iniciar nível →</button>
      <button class="btn-ghost" onclick="home()">← Voltar</button></div>
    </div></div>`);
};

/* ---------- TASK ---------- */
let speaking=false;
function speak(text,lang,btn){
  if(!("speechSynthesis"in window)){alert("Seu navegador não suporta áudio. Use o botão \"Ver transcrição\".");return;}
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang=lang||"en-US";u.rate=.94;u.pitch=1;
  const voices=speechSynthesis.getVoices();
  const v=voices.find(x=>x.lang===lang)||voices.find(x=>x.lang&&x.lang.startsWith((lang||"en").slice(0,2)));
  if(v)u.voice=v;
  u.onstart=()=>{speaking=true;if(btn){btn.classList.add("playing");btn.textContent="❚❚";}};
  u.onend=u.onerror=()=>{speaking=false;if(btn){btn.classList.remove("playing");btn.textContent="▶";}};
  window.speechSynthesis.speak(u);
}
window.toggleAudio=function(i,lang){
  const btn=document.getElementById("play"+i);
  if(speaking){window.speechSynthesis.cancel();speaking=false;btn.classList.remove("playing");btn.textContent="▶";return;}
  const t=LEVELS.find(x=>x.id===S.current).tasks[i];
  speak(t.audio,lang,btn);
};
window.showTranscript=function(i){
  const t=LEVELS.find(x=>x.id===S.current).tasks[i];
  const el=document.getElementById("tr"+i);
  el.innerHTML=`<b>Transcrição:</b> “${esc(t.audio)}”`;el.style.display="block";
};

window.task=function(i){
  const l=LEVELS.find(x=>x.id===S.current);S.ti=i;save();setAccent(l.key);
  const t=l.tasks[i];
  const prog=`Tarefa ${i+1} de ${l.tasks.length}`;
  const seg=(i+1)/l.tasks.length*100;
  let body="";

  if(t.type==="mcq"||t.type==="listen"){
    let media=convoHTML(t.convo)||"";
    if(t.type==="listen"){
      media=`<div class="voicenote">
        <button class="playbtn" id="play${i}" onclick="toggleAudio(${i},'${t.lang}')" aria-label="Tocar áudio">▶</button>
        <div class="wave">${Array.from({length:26}).map(()=>'<i></i>').join("")}</div>
        <span class="vn-meta">${esc(t.note)}</span></div>
        <div class="transcript" id="tr${i}" style="display:none"></div>`;
    }
    const opts=t.opts.map((o,k)=>`<button class="opt" id="opt${i}_${k}" onclick="answerMcq(${i},${k})"><span class="key">${"ABCD"[k]}</span><span>${esc(o.t)}</span></button>`).join("");
    body=`${media}<div class="qtext">${t.q}</div>
      ${t.type==="listen"?'<div style="margin:-6px 0 14px"><button class="btn-ghost" style="padding:7px 13px;font-size:13px" onclick="showTranscript('+i+')">Ver transcrição 📄</button></div>':""}
      <div class="opts">${opts}</div><div id="fb${i}"></div><div id="nav${i}"></div>`;
  }
  else if(t.type==="write"){
    const media=convoHTML(t.convo)||"";
    const tgts=t.targets.map((g,k)=>`<span class="tgt" id="tgt${i}_${k}"><span class="mk">·</span>${esc(g.label)}</span>`).join("");
    body=`${media}<div class="qtext">${t.q}</div>
      <textarea id="ta${i}" placeholder="Escreva sua resposta em inglês…" oninput="scanWrite(${i})" aria-label="Sua resposta"></textarea>
      <div class="wcount" id="wc${i}">0 palavras · mínimo ${t.minWords}</div>
      <div style="font-size:12px;color:var(--text-faint);font-family:var(--mono);margin-top:6px">Alvos detectados automaticamente:</div>
      <div class="targets">${tgts}</div>
      <div class="btnrow"><button class="btn" id="chk${i}" onclick="checkWrite(${i})" disabled>Enviar resposta</button></div>
      <div id="fb${i}"></div><div id="nav${i}"></div>`;
  }

  render(`<div class="screen">
    <div class="rail">${l.tasks.map((_,k)=>`<div class="railseg ${k<i?'done':''} ${k===i?'active':''}" style="--seg:${l.seg}"><div class="bar"></div></div>`).join("")}</div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin:2px 2px 0"><span style="font-family:var(--mono);font-size:12px;color:var(--text-faint)">${prog}</span><button class="btn-ghost" style="padding:6px 12px;font-size:12.5px" onclick="goLevel(${l.id})">Sair</button></div>
    <div class="card">${body}</div></div>`);

  if(t.type==="mcq"||t.type==="listen"){
    const ans=S.answered[l.id+"_"+i];
    if(ans!=null)lockMcq(i,ans);
  }
};

/* ---------- MCQ answering ---------- */
window.answerMcq=function(i,k){
  const l=LEVELS.find(x=>x.id===S.current);const t=l.tasks[i];
  if(S.answered[l.id+"_"+i]!=null)return;
  const correct=t.opts.findIndex(o=>o.ok);
  const good=t.opts[k].ok;
  S.answered[l.id+"_"+i]=k;
  if(good){S.streak++;addXp(25);}else{S.streak=0;save();updHud();}
  lockMcq(i,k,true);
};
function lockMcq(i,chosen,live){
  const l=LEVELS.find(x=>x.id===S.current);const t=l.tasks[i];
  const correct=t.opts.findIndex(o=>o.ok);
  t.opts.forEach((o,k)=>{
    const el=document.getElementById(`opt${i}_${k}`);if(!el)return;
    el.disabled=true;
    if(k===correct)el.classList.add("correct");
    else if(k===chosen)el.classList.add("wrong");
    else el.classList.add("dim");
  });
  const good=t.opts[chosen].ok;
  document.getElementById("fb"+i).innerHTML=`<div class="fb ${good?'good':'bad'}"><div class="fbh">${good?'✓ Isso! +25 XP':'✗ Quase lá'}</div>${t.fb}</div>`;
  showNav(i,live);
}

/* ---------- WRITE ---------- */
function normalize(s){return s.toLowerCase().replace(/[’]/g,"'").replace(/\s+/g," ");}
window.scanWrite=function(i){
  const l=LEVELS.find(x=>x.id===S.current);const t=l.tasks[i];
  const ta=document.getElementById("ta"+i);const txt=normalize(ta.value);
  const words=(ta.value.trim().match(/\S+/g)||[]).length;
  document.getElementById("wc"+i).textContent=`${words} palavras · mínimo ${t.minWords}`;
  let hits=0;
  t.targets.forEach((g,k)=>{
    const re=new RegExp(g.re,"i");const el=document.getElementById(`tgt${i}_${k}`);
    if(re.test(txt)){el.classList.add("hit");el.querySelector(".mk").textContent="✓";hits++;}
    else{el.classList.remove("hit");el.querySelector(".mk").textContent="·";}
  });
  const btn=document.getElementById("chk"+i);
  btn.disabled=!(words>=t.minWords);
  return hits;
};
window.checkWrite=function(i){
  const l=LEVELS.find(x=>x.id===S.current);const t=l.tasks[i];
  if(S.answered[l.id+"_"+i]!=null)return;
  const hits=scanWrite(i);
  const xp=15+10*hits;
  S.answered[l.id+"_"+i]="w";addXp(xp);
  document.getElementById("ta"+i).setAttribute("readonly","");
  document.getElementById("chk"+i).disabled=true;
  const need=t.targets.length;
  const msg=hits>=Math.ceil(need*0.75)?`✓ Ótimo! Você usou ${hits}/${need} alvos. +${xp} XP`
           :hits>0?`✓ Bom começo — ${hits}/${need} alvos. +${xp} XP`
           :`Resposta enviada. Nenhum alvo detectado ainda — compare com o modelo. +${xp} XP`;
  document.getElementById("fb"+i).innerHTML=
    `<div class="fb ${hits>0?'good':'bad'}"><div class="fbh">${msg}</div>
      Compare com uma resposta-modelo C1 e note as estruturas usadas.</div>
     <div class="model"><div class="mh">Resposta-modelo</div><p>“${esc(t.model)}”</p></div>`;
  showNav(i,true);
};

/* ---------- NAV ---------- */
function showNav(i,animate){
  const l=LEVELS.find(x=>x.id===S.current);
  const last=i===l.tasks.length-1;
  const nav=document.getElementById("nav"+i);
  nav.innerHTML=`<div class="btnrow"><button class="btn" onclick="${last?`finishLevel(${l.id})`:`task(${i+1})`}">${last?"Concluir nível 🏅":"Próxima →"}</button></div>`;
  if(animate)nav.firstElementChild.scrollIntoView({behavior:"smooth",block:"center"});
}

/* ---------- LEVEL COMPLETE ---------- */
window.finishLevel=function(id){
  const l=LEVELS.find(x=>x.id===id);
  if(!S.levelDone[id]){S.levelDone[id]=true;if(S.unlocked<id+1&&id<4)S.unlocked=id+1;}
  save();
  // level xp = sum of answered xp for this level (approx via recompute)
  let got=0,max=0;
  l.tasks.forEach((t,k)=>{
    if(t.type==="write")max+=15+10*t.targets.length;else max+=25;
  });
  const nextExists=id<4;
  render(`<div class="screen"><div class="card badge-pop" style="text-align:center">
    <div class="eyebrow" style="justify-content:center">Nível ${id} concluído</div>
    <div class="medal">${l.badge.em}</div>
    <h1 style="font-size:26px">Badge desbloqueada</h1>
    <p style="color:var(--text-dim);margin-top:4px">🏅 <b>${esc(l.badge.name)}</b></p>
    <div class="scoreline">
      <div class="sc"><b>${S.xp}</b><span>XP total</span></div>
      <div class="sc"><b>${S.best}</b><span>maior streak</span></div>
      <div class="sc"><b>${Object.keys(S.levelDone).length}/4</b><span>níveis</span></div>
    </div>
    <div class="btnrow" style="justify-content:center">
      ${nextExists?`<button class="btn" onclick="goLevel(${id+1})">Próximo nível →</button>`:`<button class="btn" onclick="finalScreen()">Ver resultado final 🏆</button>`}
      <button class="btn-ghost" onclick="home()">Menu</button>
    </div></div></div>`);
};

/* ---------- FINAL ---------- */
function finalScreen(){
  setAccent("a4");updHud();
  const pct=Math.round((S.xp/MAXXP)*100);
  let rank,em;
  if(pct>=88){rank="Fluência quase nativa";em="🏆";}
  else if(pct>=72){rank="Avançado — C1 confirmado";em="🚀";}
  else if(pct>=52){rank="Intermediário sólido";em="💬";}
  else{rank="Aprendiz — continue praticando";em="🌱";}
  const badges=LEVELS.filter(l=>S.levelDone[l.id]).map(l=>`<div class="bw"><span class="em">${l.badge.em}</span>${esc(l.badge.name)}</div>`).join("");
  render(`<div class="screen"><div class="cert">
    <div class="eyebrow" style="justify-content:center">Certificado de Revisão · English C1</div>
    <div style="font-size:52px;margin:8px 0">${em}</div>
    <h1 class="rank">${rank}</h1>
    <p class="mini" style="margin-top:4px">Você completou os 4 níveis do treino da Teacher Debs.</p>
    <div class="scoreline">
      <div class="sc"><b>${S.xp}</b><span>de ${MAXXP} XP</span></div>
      <div class="sc"><b>${pct}%</b><span>aproveitamento</span></div>
      <div class="sc"><b>${S.best}</b><span>maior streak 🔥</span></div>
    </div>
    <div class="badgewall">${badges||'<span class="mini">Nenhuma badge ainda</span>'}</div>
    <p class="mini">Revisado: phrasal verbs de séries · vocabulário de crime & opinião (Adolescence) · dilemas e decisões · percepção + relative clauses — tudo aplicado a DMs, comentários e fóruns.</p>
    <div class="btnrow" style="justify-content:center"><button class="btn" onclick="home()">Menu</button><button class="btn-ghost" onclick="resetAll()">Refazer do zero</button></div>
  </div>
  <div class="foot">Feito para a aula de English C1 · Teacher Debs 💛</div></div>`);
}
window.finalScreen=finalScreen;

/* voices sometimes load async */
if("speechSynthesis"in window){speechSynthesis.onvoiceschanged=()=>{};}

updHud();home();
</script>
