<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Treinamento Gamificado — Algoritmo e Lógica de Programação</title>
<style>
:root{
  --bg:#0d1117; --bg2:#151b23; --bg3:#1c2530; --line:#2a3341;
  --text:#e6edf3; --text-dim:#9aa7b5; --text-faint:#6b7787;
  --w1:#f2a63c; --w1-bg:#3a2c14; /* Mundo 1 amber */
  --w2:#31c3d6; --w2-bg:#123338; /* Mundo 2 cyan */
  --w3:#a97bf0; --w3-bg:#2a2140; /* Mundo 3 violet */
  --w4:#4fce7a; --w4-bg:#153524; /* Mundo 4 green */
  --ok:#4fce7a; --err:#e5637a; --warn:#f2a63c;
  --radius:12px;
  --code-bg:#0a0e14;
  --font: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono: ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text); font-family:var(--font);
  line-height:1.55; -webkit-font-smoothing:antialiased;
}
#app{max-width:920px;margin:0 auto;padding:0 16px 64px;}
a{color:var(--w2);}
h1,h2,h3,h4{line-height:1.25; font-weight:700;}
button{font-family:inherit;cursor:pointer;}
.btn{
  background:var(--bg3); color:var(--text); border:1px solid var(--line);
  border-radius:10px; padding:12px 20px; font-size:15px; font-weight:600;
  transition:background .15s,border-color .15s,transform .1s;
}
.btn:hover{background:#242e3c;border-color:#3a4657;}
.btn:active{transform:scale(.98);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-primary{background:var(--w2);color:#04262b;border-color:var(--w2);}
.btn-primary:hover{background:#4fd2e3;}
.btn-danger{background:var(--err);color:#2a0009;border-color:var(--err);}
.btn-block{display:block;width:100%;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;}

/* ---------- header / topbar ---------- */
#topbar{
  position:sticky;top:0;z-index:20;background:rgba(13,17,23,.92);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);padding:10px 16px;margin-bottom:22px;
}
#topbar-inner{max-width:920px;margin:0 auto;display:flex;align-items:center;gap:14px;}
#topbar .brand{font-weight:800;font-size:15px;white-space:nowrap;cursor:pointer;}
#topbar .brand span{color:var(--w1);}
#xpwrap{flex:1;display:flex;align-items:center;gap:8px;min-width:0;}
#xpbar-track{flex:1;height:10px;border-radius:6px;background:var(--bg3);overflow:hidden;border:1px solid var(--line);}
#xpbar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--w1),var(--w4));width:0%;transition:width .5s ease;}
#xplabel{font-size:12px;color:var(--text-dim);white-space:nowrap;font-variant-numeric:tabular-nums;}
#backbtn{font-size:13px;padding:8px 12px;}

/* ---------- map ---------- */
.hero{margin:8px 0 28px;}
.hero h1{font-size:1.5rem;margin:0 0 6px;}
.hero p{color:var(--text-dim);margin:0;font-size:.95rem;}
.world{margin-bottom:30px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--bg2);}
.world-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;flex-wrap:wrap;}
.world-head h2{margin:0;font-size:1.05rem;display:flex;align-items:center;gap:10px;}
.world-dot{width:12px;height:12px;border-radius:50%;flex:none;}
.world-progress{font-size:12px;color:var(--text-dim);min-width:120px;}
.world-bar-track{height:6px;border-radius:4px;background:var(--bg3);margin-top:4px;overflow:hidden;}
.world-bar-fill{height:100%;border-radius:4px;}
.level-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;padding:0 16px 16px;}
.level-card{
  border:1px solid var(--line);border-radius:10px;padding:13px 14px;background:var(--bg3);
  display:flex;flex-direction:column;gap:6px;text-align:left;color:var(--text);
  min-height:96px;position:relative;
}
.level-card.available{cursor:pointer;}
.level-card.available:hover{border-color:var(--accent,var(--w2));background:#212b38;}
.level-card.completed{cursor:pointer;}
.level-card.locked{opacity:.5;cursor:not-allowed;}
.level-card .lv-top{display:flex;align-items:center;justify-content:space-between;gap:6px;}
.level-card .lv-num{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;font-weight:700;}
.level-card .lv-title{font-size:14px;font-weight:600;}
.level-card .lv-status{font-size:12px;color:var(--text-dim);margin-top:auto;}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:700;}
.badge-ok{background:rgba(79,206,122,.15);color:var(--ok);}
.badge-lock{background:rgba(255,255,255,.06);color:var(--text-faint);}
.boss-card{
  margin:20px 16px 22px;padding:20px;border-radius:var(--radius);border:1px solid #4a2740;
  background:linear-gradient(135deg,#2a1420,#1c1024);text-align:center;
}
.boss-card h2{margin:0 0 6px;font-size:1.2rem;}
.boss-card p{color:var(--text-dim);margin:0 0 14px;font-size:.9rem;}
.reset-row{text-align:center;margin-top:8px;}
.reset-row button{font-size:12px;color:var(--text-faint);background:none;border:none;text-decoration:underline;padding:6px;}

/* ---------- level view ---------- */
.level-header{margin:6px 0 20px;}
.level-header .eyebrow{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);}
.level-header h1{font-size:1.4rem;margin:6px 0 0;}
.stage-tabs{display:flex;gap:6px;margin-bottom:22px;flex-wrap:wrap;}
.stage-tab{
  flex:1;min-width:80px;text-align:center;padding:8px 6px;border-radius:8px;font-size:12px;font-weight:700;
  background:var(--bg3);color:var(--text-faint);border:1px solid var(--line);
}
.stage-tab.active{color:#fff;background:var(--accent);border-color:var(--accent);}
.stage-tab.done{color:var(--accent);border-color:var(--accent);}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:16px;}
.card h2{margin-top:0;font-size:1.1rem;}
.card h3{font-size:1rem;margin:20px 0 8px;color:var(--accent);}
.card p{margin:0 0 12px;}
.analogy-box{
  border-left:3px solid var(--accent);background:rgba(255,255,255,.03);padding:12px 16px;border-radius:0 8px 8px 0;margin:14px 0;
}
pre{
  background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:14px 16px;overflow-x:auto;
  font-family:var(--mono);font-size:13px;line-height:1.5;margin:12px 0;
}
code{font-family:var(--mono);}
:not(pre)>code{background:var(--code-bg);padding:1px 6px;border-radius:4px;font-size:.9em;border:1px solid var(--line);}
.tbl-wrap{overflow-x:auto;margin:14px 0;border:1px solid var(--line);border-radius:8px;}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:280px;}
table caption{caption-side:top;text-align:left;padding:8px 10px;font-weight:700;color:var(--accent);background:var(--bg3);font-size:12.5px;}
th,td{border-bottom:1px solid var(--line);padding:7px 12px;text-align:center;white-space:nowrap;}
th{background:var(--bg3);color:var(--text-dim);font-weight:700;}
tr:last-child td{border-bottom:none;}
ol,ul{padding-left:22px;}
li{margin-bottom:6px;}

/* ---------- quiz ---------- */
.quiz-progress{font-size:12px;color:var(--text-dim);margin-bottom:10px;font-weight:700;}
.quiz-q{font-size:1.05rem;font-weight:600;margin-bottom:18px;}
.opt{
  display:block;width:100%;text-align:left;padding:13px 16px;margin-bottom:9px;border-radius:10px;
  border:1px solid var(--line);background:var(--bg3);color:var(--text);font-size:14.5px;
}
.opt:hover{border-color:var(--accent);}
.opt.selected{border-color:var(--accent);background:rgba(255,255,255,.05);box-shadow:0 0 0 1px var(--accent) inset;}
.opt b{color:var(--accent);margin-right:8px;}

.result-summary{text-align:center;padding:10px 0 20px;}
.result-summary .score{font-size:2.6rem;font-weight:800;}
.result-summary .verdict{font-size:1.05rem;font-weight:700;margin-top:4px;}
.verdict.pass{color:var(--ok);}
.verdict.fail{color:var(--err);}
.review-item{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;background:var(--bg3);}
.review-item .rq{font-weight:600;margin-bottom:8px;}
.review-item .ra{font-size:13.5px;margin:3px 0;}
.review-item .wrong{color:var(--err);}
.review-item .right{color:var(--ok);}
.review-item .why{color:var(--text-dim);font-size:13px;margin-top:6px;font-style:italic;}

textarea{
  width:100%;min-height:150px;background:var(--bg3);border:1px solid var(--line);border-radius:10px;
  color:var(--text);padding:14px;font-family:inherit;font-size:14.5px;resize:vertical;
}
textarea:focus{outline:none;border-color:var(--accent);}
.feedback-box{border-radius:10px;padding:14px 16px;margin-top:14px;font-size:14px;}
.feedback-box.bad{background:rgba(229,99,122,.1);border:1px solid var(--err);color:#ffb3c0;}
.feedback-box.good{background:rgba(79,206,122,.1);border:1px solid var(--ok);color:#b7f0c8;}
.model-answer{background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-top:12px;font-size:13.5px;color:var(--text-dim);}

.xp-toast{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--bg3);border:1px solid var(--w1);color:var(--w1);padding:12px 22px;border-radius:30px;
  font-weight:700;font-size:14px;transition:opacity .3s,transform .3s;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.4);
}
.xp-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.diag-world{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;background:var(--bg3);}
.diag-world .dw-head{display:flex;justify-content:space-between;align-items:center;font-weight:700;}
.diag-world .dw-revise{font-size:12.5px;color:var(--warn);margin-top:6px;}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:24px;max-width:400px;width:100%;}
.modal h3{margin-top:0;}
.modal .btn-row{margin-top:20px;}

.locked-note{display:flex;align-items:center;gap:6px;color:var(--text-faint);font-size:13px;}

@media (max-width:560px){
  .hero h1{font-size:1.25rem;}
  .card{padding:16px;}
  th,td{padding:6px 8px;font-size:12px;}
  .result-summary .score{font-size:2.1rem;}
}
</style>
</head>
<body>
<div id="topbar">
  <div id="topbar-inner">
    <div class="brand" onclick="goMap()">Algoritmo<span>&amp;</span>Lógica <span>·</span> Treino</div>
    <div id="xpwrap">
      <div id="xpbar-track"><div id="xpbar-fill"></div></div>
      <div id="xplabel">0 XP</div>
    </div>
    <button id="backbtn" class="btn" onclick="goMap()" style="display:none;">← Mapa</button>
  </div>
</div>
<div id="app"></div>
<div id="xptoast" class="xp-toast"></div>

<script>
/* =========================================================================
   ALGORITMO E LÓGICA DE PROGRAMAÇÃO — TREINAMENTO GAMIFICADO
   Fonte única: apostila "Algoritmo e Lógica de Programação"
   Prof. Me. Cleber Jose Semensate Santos, EduFatecie, 2024.
   ========================================================================= */

const STORAGE_KEY = 'helpdebs_algoritmos_v1';

const WORLDS = [
  {id:'w1', name:'Mundo 1 · Fundamentos da Lógica', color:'#f2a63c', bg:'#3a2c14'},
  {id:'w2', name:'Mundo 2 · Dados e Variáveis',       color:'#31c3d6', bg:'#123338'},
  {id:'w3', name:'Mundo 3 · Decisão',                 color:'#a97bf0', bg:'#2a2140'},
  {id:'w4', name:'Mundo 4 · Repetição',               color:'#4fce7a', bg:'#153524'},
];

/* LEVELS and BOSS content follow below. Kept as literal arrays for readability. */
const LEVELS = [

/* =====================================================================
   NÍVEL 1 — Lógica, Premissas e os Métodos de Raciocínio
   Unidade 1, Tópicos 1 e 2
   ===================================================================== */
{
id:'l1', world:'w1', title:'Lógica, Premissas e os Métodos de Raciocínio', subtitle:'Unidade 1 · Tópicos 1 e 2',
didactic: `
<p>Pensa em como você resolve um mistério do dia a dia: "por que a planta murchou?". Você junta pistas (não reguei há 3 dias, o sol bateu forte, a terra está seca) e chega a uma conclusão. Isso é <strong>raciocínio</strong>: a capacidade de ligar causas a efeitos a partir do que você observa.</p>
<div class="analogy-box"><strong>Premissas são pistas.</strong> Se eu te digo "Maria é filha de Pedro" e "Beto é filho de Pedro", mesmo sem te dizer diretamente, você já sabe que Maria e Beto são irmãos. Você juntou duas pistas (premissas) e tirou uma conclusão nova — isso é lógica em ação, formalizada pela primeira vez por Aristóteles na Grécia Antiga.</p></div>
<p>Existem dois "estilos de detetive" para chegar a conclusões:</p>
<ul>
<li><strong>Método indutivo</strong> — você repara em um padrão que se repete ("todo dia o sol nasce entre 6h e 6h15") e assume que ele vai continuar. É rápido, mas arriscado: você pode ter visto só uma parte da história. Um clássico é achar que "todo cisne é branco" — até você viajar para a Nova Zelândia e encontrar um cisne preto. A generalização quebrou.</li>
<li><strong>Método dedutivo</strong> — você só aceita a conclusão se ela vier de fatos 100% comprovados, encadeados em causa e efeito, como um teste de DNA que prova (ou não) uma paternidade. É mais lento de montar, mas muito mais seguro: se as premissas são verdadeiras, a conclusão é garantida.</li>
</ul>
<p>Resolver qualquer problema — inclusive escrever um programa depois — passa por um roteiro parecido: entender bem o que se pede, listar tudo que você sabe sobre o problema, colocar essas informações em ordem de causa e efeito, avaliar, e só então concluir.</p>
`,
technical: `
<p>De acordo com Cormen <em>et al.</em> (2012) e com a linha de raciocínio apresentada na apostila, o <strong>raciocínio</strong> é a capacidade do ser humano de estabelecer relações de causa e efeito a partir de fatos observados. Na Grécia Antiga (322 a.C.), Aristóteles formalizou esse uso da razão (<em>logus</em>), dando origem à <strong>lógica</strong>, um ramo da Filosofia. Na lógica de Aristóteles, o raciocínio é representado por declarações chamadas <strong>premissas</strong>, que descrevem fatos ou conhecimentos de senso comum.</p>
<h3>Exemplo de premissas (Maria, Beto e Pedro)</h3>
<ol>
<li>Duas pessoas são irmãs entre si quando ambas possuem ao menos um mesmo pai ou mãe.</li>
<li>Maria é filha de Pedro.</li>
<li>Beto é filho de Pedro.</li>
</ol>
<p>Conclusão: <strong>Beto é irmão de Maria ou Maria é irmã de Beto.</strong></p>
<p>A lógica também é usada em demonstrações matemáticas, de forma totalmente simbólica:</p>
<pre>X = A
Y = A
Logo, X = Y.</pre>
<p>Essa é a representação formal da premissa "se duas grandezas são iguais a uma terceira, então são iguais entre si".</p>
<h3>Os 5 passos da análise descritiva de um problema (Russell e Norvig, 2013)</h3>
<ol>
<li><strong>Enunciar o problema</strong> — descrever claramente o objetivo, sem palavras vagas.</li>
<li><strong>Descrever todas as partes constituintes do problema</strong> — levantar as premissas: fatos do enunciado, conhecimentos de senso comum, conhecimentos técnicos, relações de causa e efeito, sujeitos e objetos envolvidos.</li>
<li><strong>Ordenação lógica das premissas</strong> — premissas-causa vêm antes de premissas-efeito; um efeito pode ser causa de outro fato (efeito cascata).</li>
<li><strong>Avaliação conclusiva</strong> — aplicar o método dedutivo ou indutivo para obter a solução.</li>
<li><strong>Conclusão</strong> — formalizar a conclusão; se nenhuma conclusão foi obtida, retorna-se ao 2º passo para verificar premissas faltantes.</li>
</ol>
<h3>Método Indutivo</h3>
<p>Segundo Law (2008), no método indutivo as premissas conduzem a uma "lei de formação" pela repetição de um <strong>padrão de comportamento</strong>. Exemplo: observando o sol nascer por 30 dias sempre entre 6h e 6h15, conclui-se (por indução) que ele nasce nesse intervalo. É empregado com reserva no meio científico porque a conclusão é uma <strong>generalização</strong>, que pode levar a inverdades: observar 5.000 cisnes brancos e concluir "todo cisne é branco" falha ao encontrar um cisne preto na Nova Zelândia.</p>
<h3>Método Dedutivo</h3>
<p>No método dedutivo, as premissas são avaliadas e ordenadas em uma <strong>sequência de causa e efeito</strong>, de modo que a conclusão emerge como fato novo deduzido das premissas. Exemplo (as 9 premissas do DNA de Maria e João): a partir de fatos sobre DNA, descendência e o resultado de um teste de DNA de Maria sem componentes de João, conclui-se: <strong>"João não é pai de Maria ou Maria não é filha de João"</strong>. O método dedutivo exige mais premissas, todas válidas, e é o método dos cientistas — não admite generalizações.</p>
`,
quiz:[
 {statement:'Considere as premissas: (a) duas pessoas são irmãs quando têm ao menos um mesmo pai ou mãe; (b) Maria é filha de Pedro; (c) Beto é filho de Pedro. Qual conclusão a apostila tira desse conjunto?',
  options:['Beto é irmão de Maria ou Maria é irmã de Beto.','Pedro é irmão de Maria.','Maria é mãe de Beto.','Não é possível concluir nada sem saber a idade dos dois.'],
  correct:0, justification:'A apostila conclui exatamente isso a partir das três premissas sobre parentesco comum via Pedro.'},
 {statement:'No exemplo das 9 premissas sobre o DNA de Maria e João, qual método de raciocínio foi utilizado para concluir que "João não é pai de Maria"?',
  options:['Indutivo, pois a conclusão vem da observação repetida de exames.','Dedutivo, pois a conclusão decorre de uma sequência de fatos comprovadamente verdadeiros.','Nenhum dos dois, pois testes de DNA não seguem lógica formal.','Indutivo, pois generaliza o resultado de um teste para todos os casos.'],
  correct:1, justification:'O método dedutivo organiza premissas verdadeiras em sequência de causa e efeito; não é generalização a partir de repetição, por isso não é indutivo.'},
 {statement:'Por que a apostila trata o método indutivo "com muita reserva" no meio científico?',
  options:['Porque ele nunca produz conclusões corretas.','Porque suas conclusões são generalizações que podem levar a inverdades, como no exemplo dos cisnes brancos.','Porque ele exige premissas verdadeiras demais para ser prático.','Porque ele só pode ser aplicado a problemas matemáticos.'],
  correct:1, justification:'O risco do indutivo é generalizar um padrão observado (todos os cisnes vistos eram brancos) e errar ao encontrar um caso fora do padrão (cisne preto).'},
 {statement:'Segundo os 5 passos da análise descritiva de um problema, o que caracteriza o 3º passo?',
  options:['Enunciar claramente o problema.','Ordenação lógica das premissas, colocando causas antes de efeitos.','Avaliar a sequência aplicando o método dedutivo ou indutivo.','Formalizar a conclusão obtida.'],
  correct:1, justification:'O 3º passo é a ordenação lógica das premissas segundo a regra causa→efeito; os passos 4 e 5 são avaliação conclusiva e conclusão, respectivamente.'},
 {statement:'Como a apostila define "raciocínio"?',
  options:['A capacidade de memorizar grandes quantidades de fatos.','A capacidade do ser humano de estabelecer relações de causa e efeito a partir de fatos observados.','A capacidade de um computador de tomar decisões sem supervisão humana.','A capacidade de repetir um procedimento sem entender seu propósito.'],
  correct:1, justification:'A apostila descreve o raciocínio como o uso da razão para estabelecer relações de causa e efeito a partir de fatos observados — não é memorização nem capacidade da máquina.'},
 {statement:'Segundo a apostila, quem formalizou o estudo do raciocínio (logus), dando origem à lógica como área da Filosofia, e em que época aproximada?',
  options:['Guido van Rossum, no século XX.','Aristóteles, na Grécia Antiga, por volta de 322 a.C.','Descartes, na França, no século XVII.','Cormen, no século XXI, ao definir algoritmos.'],
  correct:1, justification:'A apostila atribui a formalização do raciocínio (logus/lógica) a Aristóteles, na Grécia Antiga, em torno de 322 a.C.'},
 {statement:'Na representação simbólica "X = A; Y = A; logo, X = Y", qual premissa geral do texto ela demonstra formalmente?',
  options:['Se duas grandezas são iguais a uma terceira, então são iguais entre si.','Toda variável em Python deve iniciar com uma letra.','Se A é falso, então X é automaticamente verdadeiro.','A ordem das premissas nunca importa para a conclusão.'],
  correct:0, justification:'A apostila apresenta esse exemplo simbólico como a representação matemática formal da premissa sobre igualdade transitiva entre grandezas.'},
],
discursive:{
  question:'Explique a diferença entre o método indutivo e o método dedutivo, citando o que caracteriza cada um.',
  threshold:3,
  groups:[
    {label:'Método indutivo', synonyms:['indutivo','inducao']},

    {label:'Método dedutivo', synonyms:['dedutivo','deducao']},

<p>Pensa em quatro formas simples de conectar ideias que você já usa sem perceber:</p>
<div class="analogy-box">
<p><strong>Implicação (se... então):</strong> "se chove, a calçada molha". A chuva é a causa; a calçada molhada é o efeito. Essa promessa só é <em>quebrada</em> (falsa) em uma única situação: choveu e a calçada continuou seca. Em qualquer outro cenário, a implicação continua de pé.</p>
<p><strong>OU:</strong> pense no cardápio "sobremesa ou fruta" de um bufê generoso — você pode pegar só sobremesa, só fruta, ou as duas! O OU da lógica é assim: inclusivo. Só falha quando você não pega nenhuma das duas.</p>
<p><strong>E:</strong> uma autorização bancária que precisa das assinaturas do presidente <em>e</em> do tesoureiro. Falta uma assinatura, o pagamento não sai. Só funciona com as duas presentes.</p>
<p><strong>Negação:</strong> vivo/morto, ligado/desligado — inverte o estado. E negar duas vezes volta ao estado original: "não estar não-vivo" é o mesmo que estar vivo.</p>
</div>
<p>Essas quatro peças (implicação, OU, E, negação) são o alfabeto que te permite montar qualquer premissa mais complexa.</p>

technical:`
<h3>Operador de Implicação (A→B)</h3>
<p>Constitui a operação lógica CAUSA→EFEITO: quando A acontece (causa), B necessariamente acontece (efeito). Exemplo: (CHUVA)→(CALÇADA MOLHADA).</p>
<div class="tbl-wrap"><table><caption>QUADRO 1 – Tabela verdade do operador Implicação</caption>
<tr><th>A</th><th>B</th><th>A → B</th></tr>
<tr><td>F</td><td>F</td><td>V</td></tr>
<tr><td>F</td><td>V</td><td>V</td></tr>
<tr><td>V</td><td>F</td><td>F</td></tr>
<tr><td>V</td><td>V</td><td>V</td></tr>
</table></div>
<p>O operador A→B <strong>somente é falso quando A é verdadeiro e B é falso.</strong></p>
<h3>Operador OU (A + B)</h3>
<p>Relaciona dois fatos que podem ocorrer conjuntamente ou de forma alternada. Exemplo: (COR DE BOVINOS): (BRANCA + PRETA) — pode ser extendido a mais elementos: (BRANCA + PRETA + MARROM).</p>
<div class="tbl-wrap"><table><caption>QUADRO 2 – Tabela verdade do operador OU</caption>
<tr><th>A</th><th>B</th><th>A + B</th></tr>
<tr><td>F</td><td>F</td><td>F</td></tr>
<tr><td>F</td><td>V</td><td>V</td></tr>
<tr><td>V</td><td>F</td><td>V</td></tr>
<tr><td>V</td><td>V</td><td>V</td></tr>
</table></div>
<p>O operador A + B <strong>somente é falso quando A é falso e B é falso.</strong></p>
<h3>Operador E (A.B)</h3>
<p>Relaciona dois fatos que só ocorrem juntos. Exemplo: (AUTORIZAR PAGAMENTO): (ASSINATURA PRESIDENTE . TESOUREIRO) — extensível: (...TESOUREIRO . VICE-PRESIDENTE).</p>
<div class="tbl-wrap"><table><caption>QUADRO 3 – Tabela do operador E</caption>
<tr><th>A</th><th>B</th><th>A.B</th></tr>
<tr><td>F</td><td>F</td><td>F</td></tr>
<tr><td>F</td><td>V</td><td>F</td></tr>
<tr><td>V</td><td>F</td><td>F</td></tr>
<tr><td>V</td><td>V</td><td>V</td></tr>
</table></div>
<p>O operador A.B <strong>somente é verdadeiro quando A é verdadeiro e B é verdadeiro.</strong></p>
<h3>Operador de Negação (~A)</h3>
<p>Inverte o estado lógico: (MORTE): (~VIDA). A negação da negação retorna ao estado original: (VIDA): ~(~VIDA).</p>
<div class="tbl-wrap"><table><caption>QUADRO 4 – Tabela verdade do operador Negação</caption>
<tr><th>A</th><th>~A</th></tr>
<tr><td>F</td><td>V</td></tr>
<tr><td>V</td><td>F</td></tr>
</table></div>

didactic:`
<p>Imagina uma receita de bolo. Ela não pensa — quem pensou foi quem escreveu a receita. O forno só obedece ao que está escrito. Computadores são exatamente assim: <strong>não pensam</strong>. Quem detém a razão é o programador, que precisa deixar tudo explícito, sem "deduzir sozinho" nada.</p>
<div class="analogy-box"><strong>Algoritmo é a receita escrita</strong> — uma sequência de passos clara, ordenada e finita para chegar a um resultado. E antes de servir aos convidados, você prova a receita: isso é o <strong>teste de mesa</strong>, simular cada passo manualmente para garantir que o resultado final é o esperado antes de "publicar" o algoritmo.</p></div>
<p>Se ao provar a receita algo deu errado, você não joga tudo fora — volta e revê a lista de ingredientes e passos (2º passo da criação), ajusta a ordem se precisar, e testa de novo.</p>
`,
technical:`
<p>Computadores são máquinas: não têm capacidade de pensar, não criam iniciativa própria. Todo computador executa uma <strong>sequência de comandos</strong> (um programa) previamente criada por um ser humano — o <strong>programador</strong>, que detém o uso da razão para elaborar essa sequência lógica.</p>
<p>A <strong>programação de computadores</strong> é o processo de registrar na memória da máquina essa sequência de comandos, escrita em uma <strong>linguagem de programação</strong>. Não é necessário conhecer todas as linguagens existentes — é necessário saber <strong>criar um algoritmo</strong>.</p>
<h3>4.1 Algoritmos</h3>
<p>De acordo com Cormen <em>et al.</em> (2012), um <strong>algoritmo</strong> é uma sequência de instruções, escritas de forma <strong>clara, ordenada e finita</strong>, elaborada para realizar uma determinada tarefa ou resolver um problema.</p>
<h3>Os 4 passos da criação de algoritmos (Cormen, 2014)</h3>
<ol>
<li><strong>Descrição do problema a resolver ou tarefa a ser feita</strong> — definição clara e objetiva; com frequência, o próprio título do algoritmo já basta (ex.: "Receita de pudim de leite condensado").</li>
<li><strong>Decompor a tarefa ou o problema em todas as ações necessárias para a realização</strong> — relacionar todos os itens necessários; nenhuma ação (instrução) pode ser esquecida ou implicitamente entendida.</li>
<li><strong>Ordenação lógica das ações</strong> — ordenar as ações de modo que, ao final, a tarefa esteja resolvida com sucesso.</li>
<li><strong>Conclusão</strong> — avaliar a sequência de instruções testando-a passo a passo, na ordem estabelecida, verificando se a tarefa foi concluída com êxito. Esse teste é conhecido como <strong>teste de mesa</strong>.</li>
</ol>
<p>Caso a tarefa não tenha sido concluída com êxito no teste de mesa, <strong>retorna-se ao 2º passo</strong>, verificando a falta de alguma instrução, e seguem-se novamente o 3º e o 4º passos, sucessivamente, até que o algoritmo esteja certo. Caso a tarefa tenha sido concluída com êxito, o algoritmo está pronto.</p>
`,

didactic:`
<p>O algoritmo é a ideia; o código é a tradução dessa ideia para uma língua que o computador entende — e essa tradução (codificação) nem sempre é 1 para 1: às vezes um passo do algoritmo vira várias linhas de código, às vezes várias linhas viram uma só.</p>
<div class="analogy-box">
<p><strong>Modo interativo do IDLE</strong> é como uma calculadora que responde na hora: você digita <code>x=10</code>, depois <code>y=12</code>, depois <code>x+y</code>, e o ambiente já devolve <code>22</code> na mesma hora.</p>
<p><strong>Modo programado</strong> é como escrever uma carta inteira antes de enviá-la: você escreve todo o programa no editor e só quando aperta <strong>F5</strong> ("enviar a carta") é que tudo roda de uma vez.</p>
</div>
<p>Python foi criado por Guido van Rossum em 1991 e ficou popular porque é uma linguagem "de leitura fácil" — quase como pseudocódigo em inglês. Um jeito de lembrar as 5 vantagens dela: é <strong>clara</strong> (fácil de ler), funciona em <strong>vários estilos</strong> de programar, é <strong>interpretada</strong> (roda sem precisar "compilar" antes), é <strong>portátil</strong> (o mesmo código roda em máquinas diferentes) e serve como <strong>script</strong> (cola com outros programas do sistema).</p>
`,
technical:`
<p>O processo de transformar um algoritmo em programa é a <strong>codificação</strong>. Essa relação algoritmo↔código não é direta: uma instrução do algoritmo pode virar várias instruções de código, e vice-versa.</p>
<h3>5.1 Introdução à Linguagem Python</h3>
<p><strong>Python</strong> foi criada em 1991 por <strong>Guido van Rossum</strong>, sendo hoje uma das linguagens mais utilizadas no mundo. Conforme Maruch e Maruch (2006), suas vantagens são:</p>
<ul>
<li><strong>Linguagem clara e simples</strong> — instruções próximas do algoritmo, fácil de entender mesmo sem experiência prévia.</li>
<li><strong>Linguagem multiparadigma</strong> — aceita programação procedural e orientada a objetos.</li>
<li><strong>Linguagem interpretada</strong> — não é compilada; roda em um ambiente instalado que interpreta o programa no momento da execução.</li>
<li><strong>Linguagem altamente portável</strong> — o mesmo código roda em máquinas diferentes, sem alterações, uma vez que o ambiente Python esteja instalado em ambas.</li>
<li><strong>Linguagem script</strong> — pode controlar e usar resultados de outros programas/aplicativos instalados no computador.</li>
</ul>
<h3>5.2 a 5.6 — O ambiente IDLE</h3>
<p>O ambiente próprio do Python é o <strong>IDLE</strong> (<em>Integrated Development and Learning Environment</em>), com dois modos:</p>
<p><strong>Modo interativo</strong> — comandos executados imediatamente, exibindo o resultado na hora:</p>
<pre>&gt;&gt;&gt; x=10
&gt;&gt;&gt; y=12
&gt;&gt;&gt; x+y
22</pre>
<p><strong>Modo programado</strong> — usa o editor de texto do IDLE. O símbolo <code>#</code> marca o início de um comentário (mensagem para o programador, não processada pela máquina). A execução do código escrito no editor é feita pela tecla <strong>F5</strong>.</p>
<h3>Regras de variáveis</h3>
<p>Variáveis em Python iniciam sempre com uma letra, não podem ter espaços, e são <em>case sensitive</em>. Não é necessário declarar o tipo — a linguagem o define automaticamente a partir do valor atribuído.</p>
<p><strong>Exemplos válidos:</strong></p>
<pre>x=10
nome="Maria"
Area_do_quadrado= Base * Altura
CATETO2=200.345</pre>
<p><strong>Exemplos inválidos:</strong></p>
<pre>20Casal=300
Nome de Família = "Torres"</pre>
<h3>input e print</h3>
<pre>Nome_da_Variavel = input('Mensagem ao usuário ')
print('Mensagem ao usuário')
print('Mensagem sobre alguma saída de dados', Nome_da_Variavel)</pre>
<h3>6. Criando um programa em Python — o problema da garagem</h3>
<p><strong>Enunciado:</strong> o plano diretor de uma cidade determina o percentual máximo de área destinado para garagem em relação à área total do terreno. Um programa deve receber as medidas do terreno e da garagem e calcular o percentual de ocupação.</p>
<p><strong>Algoritmo (8 passos):</strong></p>
<ol>
<li>Entrar com o valor da largura da garagem em metros;</li>
<li>Entrar com o valor da profundidade da garagem em metros;</li>
<li>Calcular área da garagem = largura da garagem * profundidade da garagem;</li>
<li>Entrar com o valor da largura do terreno em metros;</li>
<li>Entrar com o valor da profundidade do terreno em metros;</li>
<li>Calcular área do terreno = largura do terreno * profundidade do terreno;</li>
<li>Calcular percentual de ocupação = (área da garagem / área do terreno) * 100;</li>
<li>Apresentar em tela o resultado.</li>
</ol>
<pre>Largura_Garagem=float(input("Entre com a largura da garagem em metros: "))
Profundidade_Garagem=float(input("Entre com a profundidade da garagem em metros: "))

#Abaixo, cálculo da área da garagem
Area_Garagem=Largura_Garagem * Profundidade_Garagem

Largura_Terreno=float(input("Entre com a largura do terreno em metros: "))
Profundidade_Terreno=float(input("Entre com a profundidade do terreno em metros: "))

# Abaixo, cálculo da área do terreno
Area_Terreno=Largura_Terreno * Profundidade_Terreno

# Agora, cálculo do percentual de ocupação
Percentual = ((Area_Garagem)/(Area_Terreno))* 100
print("Percentual de ocupação:",Percentual)</pre>
<p>Executando com área da garagem de 30 m² (5×6) e área do terreno de 400 m² (20×20), o resultado impresso é <code>Percentual de ocupação: 7.5</code>.</p>
`,

<p>Um computador é formado por CPU, memória e dispositivos de entrada e saída (E/S), além de um disco rígido.</p>
<ul>
<li><strong>CPU</strong> — o "cérebro" do computador: guarda e recupera valores da memória, executa aritmética básica e lógica, controla a execução das instruções.</li>
<li><strong>Memória</strong> — local de armazenamento relativamente rápido, dividido em endereços; é <strong>volátil</strong> (perde o conteúdo assim que o computador é desligado).</li>
<li><strong>Disco rígido</strong> — armazenamento mais lento que a memória e a CPU, mas <strong>persistente</strong> (retém o conteúdo mesmo com a energia desligada).</li>
<li><strong>Mouse e tela</strong> — dispositivos de entrada e saída, respectivamente.</li>
</ul>
<p>Segundo Edelweiss e Livi (2014, p. 21): <em>"Internamente, os computadores digitais operam usando o sistema numérico binário, que utiliza apenas os símbolos 0 e 1. [...] o componente conceitual básico e a menor unidade de armazenamento de informação é o bit. [...] um bit pode memorizar somente um entre dois valores: zero ou um."</em></p>
<p>Para representar caracteres, usam-se códigos armazenados em conjuntos de bits (<strong>bytes</strong>, conjuntos de 8 bits):</p>
<ul>
<li><strong>ASCII</strong> (7 bits por caractere) — usado por grande parte dos microcomputadores; o bit mais significativo (mais à esquerda) do byte é sempre igual a 0.</li>
<li><strong>EBCDIC</strong> (8 bits por caractere) — usa um byte inteiro para cada caractere.</li>
<li><strong>UNICODE</strong> (16, 32 ou mais bits) — abrange mais de 100.000 caracteres, podendo usar um, dois ou mais bytes por caractere.</li>
</ul>

<tr><td>T</td><td>tera</td><td>trilhão</td><td>10¹²</td></tr>

<p>Como o sistema interno é binário (base 2), as capacidades de armazenamento aparecem como potências de 2:</p>

   NÍVEL 6 — Constantes, Variáveis e a Atribuição por Dentro

didactic:`
<div class="analogy-box"><strong>Variável = envelope.</strong> Você põe R$30 dentro, depois alguém soma mais R$50: o envelope continua com o mesmo nome, mas o conteúdo mudou para R$80. O nome do envelope (a variável) não muda; o que está dentro dele, sim.</div>
<p>Agora um ponto que engana muita gente: quando você faz <code>b = a</code>, você <strong>não está amarrando</strong> b e a com um barbante que os faz mudar juntos para sempre. Você está apenas tirando uma cópia do "bilhete" que diz onde está o valor <em>naquele momento</em>. Se depois você mudar <code>a</code>, o <code>b</code> continua apontando pro valor antigo — porque cada variável é independente.</p>
<p>E o sinal <code>=</code> em programação <strong>não é "igual a"</strong> como na matemática — é uma seta de atribuição: "guarde o que está à direita dentro do que está à esquerda".</p>
`,
technical:`
<h3>2.1 Constantes</h3>
<p>As <strong>constantes</strong> representam dados cujo valor permanece inalterado durante a execução do programa. No Python, costumam ser declaradas em MAIÚSCULAS com palavras separadas por sublinhado, dentro de um módulo.</p>
<pre>PI = 3.1415
DolarTurismo = 4.04</pre>
<h3>2.2 Variáveis e seus Tipos</h3>
<p>Conforme Kalb (2016), uma <strong>variável</strong> é uma localização de memória nomeada que possui um determinado valor, que pode variar com o tempo. A atribuição segue a forma geral <code>&lt;variável&gt; = &lt;expressão&gt;</code>.</p>
<h3>Regras de nomeação de variáveis (Kalb, 2016)</h3>
<ul>
<li>Começar com uma letra ou sublinhado;</li>
<li>Não começar com um dígito;</li>
<li>Ter no máximo 256 caracteres;</li>
<li>Letras, dígitos, sublinhados e cifrões podem ser inseridos;</li>
<li>Não conter espaços nem símbolos matemáticos (+, -, /, *, parênteses).</li>
</ul>
<p>Duas convenções de escrita: <strong>camelCase</strong> (ex.: <code>essaVariavelNome</code>) e <strong>snake_case</strong>, com sublinhado entre palavras (ex.: <code>essa_variavel_nome</code>).</p>
<h3>3. O sinal "=" é atribuição, não igualdade</h3>
<p>Segundo Melo (2019), a operação de atribuição ocorre em três passos:</p>
<ol>
<li>Gera-se na memória o <strong>objeto</strong> resultante do lado direito da atribuição;</li>
<li>Se a variável do lado esquerdo não existir no escopo atual, ela é <strong>criada</strong>;</li>
<li>A variável passa a <strong>apontar</strong> para o objeto gerado no 1º passo.</li>
</ol>
<h3>A sequência a=1 → b=a → a=2 → c=b+6</h3>
<pre>&gt;&gt;&gt; a = 1      # a aponta para o objeto 1
&gt;&gt;&gt; b = a      # b aponta para o MESMO objeto que a aponta (1); b e a são independentes
&gt;&gt;&gt; a = 2      # a passa a apontar para um NOVO objeto (2); b continua apontando para 1
&gt;&gt;&gt; c = b + 6  # c aponta para o resultado de b+6 = 1+6 = 7</pre>
<p>Como b e c são variáveis independentes, "qualquer mudança no objeto apontado por b não vai interferir em c" — cada variável só sabe para qual objeto aponta <em>no momento</em> em que foi atribuída, e não se atualiza automaticamente quando outra variável muda.</p>
<h3>4. Os 8 tipos imutáveis</h3>
<p>No Python, esses objetos não podem ser modificados após criados — apenas a variável pode passar a apontar para um novo objeto. Segundo a apostila, os tipos básicos imutáveis são:</p>
<ul>
<li><strong>bool</strong> — só assume <code>True</code> ou <code>False</code>; o Python associa 1 a True e 0 a False.</li>
<li><strong>int</strong> — precisão arbitrária, com quantidade arbitrária de dígitos.</li>
<li><strong>float</strong> — números reais em ponto flutuante, com 64 dígitos binários de precisão; usa "." para separar a parte decimal, não ",".</li>
<li><strong>complex</strong> — números complexos; a letra "j" (maiúscula ou minúscula) representa o número imaginário.</li>
<li><strong>None</strong> (NoneType) — lugar reservado vazio, usado para representar algo desconhecido no momento.</li>
<li><strong>str</strong> — texto, declarado com aspas simples ou duplas, de modo equivalente.</li>
<li><strong>tuple</strong> — apresentado com parênteses (opcionais), elementos separados por vírgula.</li>
<li><strong>type</strong> — objetos utilizados para manipulação de tipos.</li>
</ul>
`,

/* =====================================================================
   NÍVEL 7 — Operadores Aritméticos e Atribuição Composta
   Unidade 2, Tópico 5

{
id:'l7', world:'w2', title:'Operadores Aritméticos e Atribuição Composta', subtitle:'Unidade 2 · Tópico 5',
didactic:`
<p>Pensa numa caixa de ferramentas. As quatro ferramentas básicas são soma, subtração, multiplicação e divisão (+ - * /). Depois vêm três ferramentas especiais: potência (<code>**</code>), resto da divisão (<code>%</code>) e parte inteira da divisão (<code>//</code>).</p>
<div class="analogy-box">Nessa "receita" de cálculo, a apostila estabelece uma ordem fixa de trabalho: primeiro as ferramentas especiais (<code>**</code>, <code>%</code>, <code>//</code>), depois multiplicação e divisão, e só por último soma e subtração. E se você quer forçar uma ordem diferente, só tem <strong>um</strong> tipo de "caixinha" disponível para isso: os parênteses — colchetes e chaves são reservados para outras coisas em Python.</div>
<p>E para não escrever duas vezes o nome da mesma variável (<code>auxiliar = auxiliar + 3</code>), existe um atalho: <code>auxiliar += 3</code>. Menos digitação, menos chance de erro de digitação.</p>
`,
technical:`
<p>O <strong>operador de atribuição</strong> mais simples é o <code>=</code>. Além dele, existem as quatro <strong>operações aritméticas básicas</strong>: soma (<code>+</code>), subtração (<code>-</code>), multiplicação (<code>*</code>) e divisão (<code>/</code>).</p>
<pre>&gt;&gt;&gt; soma = 1 + 2
&gt;&gt;&gt; print(soma)
3
&gt;&gt;&gt; subtracao = 4 - 3
&gt;&gt;&gt; print(subtracao)
1
&gt;&gt;&gt; multiplicacao = 2 * 3
&gt;&gt;&gt; print(multiplicacao)
6
&gt;&gt;&gt; divisao = 6 / 2
&gt;&gt;&gt; print(divisao)
3.0</pre>
<p>Além dessas, existem os <strong>operadores adicionais</strong>: potenciação (<code>**</code>), módulo/resto da divisão (<code>%</code>) e parte inteira da divisão (<code>//</code>).</p>
<pre>&gt;&gt;&gt; potencia = 2**3
&gt;&gt;&gt; print(potencia)
8
&gt;&gt;&gt; resto = 10 % 3
&gt;&gt;&gt; print(resto)
1
&gt;&gt;&gt; parteInteira = 10 // 3
&gt;&gt;&gt; print(parteInteira)
3</pre>
<h3>5.1 Ordem de interpretação dos operadores</h3>
<p>Segundo a apostila, a ordem de prioridade é: <strong>1º</strong> potência (<code>**</code>), módulo (<code>%</code>) e parte inteira (<code>//</code>); <strong>2º</strong> multiplicação e divisão (<code>*</code>, <code>/</code>); <strong>3º</strong> soma e subtração (<code>+</code>, <code>-</code>).</p>
<p>Para agrupar expressões, Python usa <strong>apenas parênteses</strong> — colchetes e chaves têm funções especiais na linguagem, não servem para agrupar contas. A ordem de interpretação vai sempre do parêntese mais interno para o mais externo. Exemplo: em <code>1 * 2 – (3 + 4)</code>, avalia-se primeiro <code>3 + 4 = 7</code>, depois <code>1 * 2 = 2</code>, e por fim <code>2 – 7 = -5</code>.</p>
<h3>5.2 Operadores de atribuição compostos</h3>
<p>Em vez de escrever <code>auxiliar = auxiliar + 3</code>, pode-se escrever <code>auxiliar += 3</code> — funcionalmente idêntico, porém mais limpo e menos sujeito a erro de digitação. Além de <code>+=</code>, existem <code>-=</code>, <code>*=</code>, <code>/=</code> e <code>%=</code>.</p>
<pre>&gt;&gt;&gt; auxiliar = 3
&gt;&gt;&gt; auxiliar = auxiliar + 2
&gt;&gt;&gt; print(auxiliar)
5
&gt;&gt;&gt; auxiliar = 3
&gt;&gt;&gt; auxiliar += 2
&gt;&gt;&gt; print(auxiliar)
5</pre>
`,

<p>Toda decisão que uma máquina toma é, no fundo, uma comparação. Mas máquina não entende "melhor" ou "pior" (isso é opinião, subjetivo) — ela só entende números e comparações objetivas. Por isso, quando a apostila fala em "suco de laranja é melhor que suco de limão", ela mostra como transformar isso em algo mensurável: comparar a <em>acidez</em> de cada um.</p>

<p><strong>E (and)</strong> exige as duas condições ao mesmo tempo — como as duas assinaturas do banco.</p>

technical:`
<p>A essência de qualquer decisão é uma comparação. Segundo Law (2008), podemos classificar as comparações em 4 categorias:</p>
<ul>
<li><strong>Equivalência ou similaridade</strong> — igual ou diferente;</li>
<li><strong>Qualidade</strong> — melhor ou pior;</li>
<li><strong>Dimensão</strong> — maior ou menor;</li>
<li><strong>Quantidade</strong> — mais ou menos, muito ou pouco.</li>
</ul>
<p>Categorias subjetivas (como "qualidade") exigem quantificação para serem representadas em programação — ex.: medir a acidez dos sucos, em vez de dizer apenas "é melhor".</p>
<h3>Operadores relacionais</h3>
<div class="tbl-wrap"><table><caption>QUADRO 1 – Operadores relacionais</caption>
<tr><th>Operador relacional</th><th>Descrição</th><th>Representação em Python</th></tr>
<tr><td>A = B</td><td>A igual a B</td><td>A == B</td></tr>
<tr><td>A ≠ B</td><td>A diferente de B</td><td>A != B</td></tr>
<tr><td>A &gt; B</td><td>A maior do que B</td><td>A &gt; B</td></tr>
<tr><td>A ≥ B</td><td>A maior ou igual a B</td><td>A &gt;= B</td></tr>
<tr><td>A &lt; B</td><td>A menor do que B</td><td>A &lt; B</td></tr>
<tr><td>A ≤ B</td><td>A menor ou igual a B</td><td>A &lt;= B</td></tr>
</table></div>
<p><strong>Exemplo (cinema):</strong> "a idade mínima para entrada no cinema é 18 anos" → PERMISSÃO PARA INGRESSO — IDADE &gt;= 18.</p>
<pre>LER IDADE DO ESTUDANTE
SE A IDADE &gt;= 18 ANOS:
    ENTÃO
        ACESSO PERMITIDO (mensagem "ACESSO PERMITIDO")
    SENÃO
        ACESSO NEGADO (mensagem "IDADE MÍNIMA NÃO ATENDIDA — ACESSO NEGADO")</pre>
<h3>Operadores lógicos: OU, E e NÃO</h3>
<div class="tbl-wrap"><table><caption>QUADRO 2 – Tabela verdade do operador lógico OU</caption>
<tr><th>A</th><th>B</th><th>A ou B</th></tr>
<tr><td>F</td><td>F</td><td>F</td></tr><tr><td>F</td><td>V</td><td>V</td></tr><tr><td>V</td><td>F</td><td>V</td></tr><tr><td>V</td><td>V</td><td>V</td></tr>
</table></div>
<p>O operador A ou B somente é falso quando A é falso e B é falso.</p>
<div class="tbl-wrap"><table><caption>QUADRO 3 – Tabela verdade do operador lógico E</caption>
<tr><th>A</th><th>B</th><th>A e B</th></tr>
<tr><td>F</td><td>F</td><td>F</td></tr><tr><td>F</td><td>V</td><td>F</td></tr><tr><td>V</td><td>F</td><td>F</td></tr><tr><td>V</td><td>V</td><td>V</td></tr>
</table></div>
<div class="tbl-wrap"><table><caption>QUADRO 4 – Tabela verdade do operador lógico de Negação</caption>
<tr><th>A</th><th>não A</th></tr><tr><td>F</td><td>V</td></tr><tr><td>V</td><td>F</td></tr>
</table></div>
<div class="tbl-wrap"><table><caption>QUADRO 5 – Operadores lógicos e sua representação em Python</caption>
<tr><th>Operador lógico</th><th>Descrição</th><th>Representação em Python</th></tr>
<tr><td>A ou B</td><td>A OU B</td><td>A or B</td></tr>
<tr><td>A e B</td><td>A E B</td><td>A and B</td></tr>
<tr><td>não A</td><td>NÃO A</td><td>not A</td></tr>
</table></div>
<p><strong>Exemplo (serviço militar):</strong> "os homens devem se apresentar aos 18 anos, enquanto as mulheres podem se apresentar com idade maior ou igual a 18 e menor do que 36 anos" →</p>
<p>SERVIÇO MILITAR – (HOMENS; IDADE = 18 ANOS) OU (MULHERES; IDADE ≥ 18 ANOS E IDADE &lt; 36 ANOS).</p>

{
id:'l9', world:'w3', title:'if, if...else, if...elif...else e Resolução de Problemas', subtitle:'Unidade 3 · Tópicos 4 e 5',
didactic:`
<div class="analogy-box">
<p><strong>if simples:</strong> "se chover, eu levo guarda-chuva" — e eu saio de casa de qualquer jeito (o "sair de casa" acontece sempre; só o guarda-chuva é condicional).</p>
<p><strong>if...else:</strong> "se chover, levo guarda-chuva; senão, levo óculos de sol" — sempre uma das duas coisas acontece, nunca as duas, nunca nenhuma.</p>
<p><strong>if...elif...else:</strong> é o cardápio de um restaurante: se pedir o prato 1, vem tal prato; senão, se pedir o prato 2, vem outro; senão, se pedir o prato 3... e assim por diante, até cair no "senão" final se nada bateu.</p>
</div>
<p>E um detalhe que engana muita gente vindo de outras linguagens: em Python <strong>não existem chaves { }</strong> para marcar onde começa e termina um bloco — é a <strong>indentação</strong> (o quanto o texto está deslocado para a direita) que define isso.</p>
`,
technical:`
<h3>4.1 Estrutura condicional if simples</h3>
<pre>if condição lógica:   #Bloco A
    Bloco de comandos executados caso a condição lógica seja verdadeira
#Bloco B
Comandos executados após o teste</pre>
<p>Se a condição for VERDADEIRA, o Bloco A é executado e, na sequência, o Bloco B também. Se a condição for FALSA, somente o Bloco B é executado.</p>
<pre>if temperatura&gt;25:
    print("Ambiente quente, ajustando ar-condicionado para clima de verão")
    AR_CONDICIONADO(VERAO)
print("Ligando o ar-condicionado")
AR_CONDICIONADO(ON)</pre>
<h3>4.2 Estrutura condicional if...else</h3>
<pre>if condição lógica:   #Bloco A
    Bloco de comandos executados caso a condição lógica seja VERDADEIRA
else:
    #Bloco B
    Bloco de comandos executados caso a condição lógica seja FALSA
#Bloco C
Comandos executados após o teste.</pre>
<p>Executa o Bloco A OU o Bloco B (nunca os dois), e depois sempre o Bloco C.</p>
<pre>if temperatura&gt;25:
    print("Ambiente quente, ajustando ar-condicionado para clima de verão")
    AR_CONDICIONADO(VERAO)
else:
    print("Ambiente frio, ajustando ar-condicionado para clima de inverno")
    AR_CONDICIONADO(INVERNO)
print("Ligando o ar-condicionado")
AR_CONDICIONADO(ON)</pre>
<h3>4.3 Estrutura condicional if...elif...else</h3>
<p>Permite encadear vários testes, frequentemente usada como menu de opções.</p>
<pre>if condição lógica1:    #Bloco A
    ...
elif condição lógica2:  #Bloco B
    ...
elif condição lógica3:  #Bloco C
    ...
else:                   #Bloco N
    Bloco de comandos executados caso NENHUMA das condições seja VERDADEIRA
#Bloco X
Comandos executados após o teste.</pre>
<p>Em Python, é a <strong>indentação/tabulação</strong> que define os blocos de cada parte do comando if — não chaves como em outras linguagens.</p>
<h3>5. Programa da garagem — versão 2 (com zoneamento)</h3>
<p>Regras: zona norte 25% máximo; zonas leste e oeste 30%; zona sul 40%. O programa envolve <strong>5 variáveis</strong>: largura e profundidade da garagem, largura e profundidade do terreno, e a zona de localização.</p>
<pre>Largura_Garagem=float(input("Entre com Largura da garagem em metros "))
Profundidade_Garagem=float(input("Entre com a Profundidade da garagem em metros "))
Area_Garagem = Largura_Garagem * Profundidade_Garagem

Largura_Terreno=float(input("Entre com Largura do Terreno em metros "))
Profundidade_Terreno=float(input("Entre com a Profundidade do Terreno em metros "))
Area_Terreno=Largura_Terreno * Profundidade_Terreno

Percentual = ((Area_Garagem)/(Area_Terreno))* 100
Zona=input("Entre com Zona de localização: Sul=S, Norte=N, Leste=L e Oeste=W :  ")

print("Imóvel localizado na zona: ",Zona)
print("Percentual de ocupação: ",Percentual)

# Sequencia de decisão
if Zona=="N" and Percentual&lt;=25:
    print("projeto atende norma de zoneamento do plano diretor")
elif Zona=="L" or Zona=="W" and Percentual&lt;=30:
    print("projeto atende norma de zoneamento do plano diretor")
elif Zona=="S" and Percentual&lt;=40:
    print("projeto atende norma de zoneamento do plano diretor")
else:
    print("REVISAR MEDIDAS. projeto NÃO atende norma de zoneamento do plano diretor")</pre>
<p>A apostila também apresenta uma <strong>versão alternativa</strong> equivalente, usando <code>if</code> aninhado dentro de cada <code>elif</code>:</p>
<pre># Nova Sequencia de decisão
if Zona=="N":
    if Percentual&lt;=25:
        print("projeto atende norma de zoneamento do plano diretor")
elif Zona=="L" or Zona=="W":
    if Percentual&lt;=30:
        print("projeto atende norma de zoneamento do plano diretor")
elif Zona=="S":
    if Percentual&lt;=40:
        print("projeto atende norma de zoneamento do plano diretor")
else:
    print("REVISAR MEDIDAS. projeto NÃO atende norma de zoneamento do plano diretor")</pre>

{
id:'l10', world:'w4', title:'O Comando for e o Teste de Mesa', subtitle:'Unidade 4 · Tópicos 1 e 2',
didactic:`
<p>O <code>for</code> é passar por cada carta de um baralho, uma de cada vez, fazendo algo com cada uma. O <code>range</code> é um baralho "de mentirinha" que você cria na hora, indicando só onde começar e onde parar.</p>
<div class="analogy-box">
<p><strong>Variável contadora</strong> é um clicador de catraca: cada pessoa que passa, clica +1 — não importa quem é a pessoa, só importa que passou. É o caso de <code>qtdeLetras</code>.</p>
<p><strong>Variável acumuladora</strong> é um cofrinho: a cada moeda que cai, o valor guardado cresce <em>de acordo com o valor daquela moeda</em>. É o caso de <code>soma</code>.</p>
</div>
<p>E o <strong>teste de mesa</strong> aqui vira uma tabela: uma linha por volta do laço, uma coluna por variável, anotando o valor de cada uma a cada passada — é assim que você prova, na unha, se o algoritmo está certo antes de rodar no computador (e é o formato clássico de questão de prova: "qual o valor de X na iteração N?").</p>
`,
technical:`
<h3>O comando for</h3>
<p>O <code>for</code> é uma estrutura de repetição baseada em uma lista, executando um código para cada elemento.</p>
<pre>lista = [10, 11, 12, 13, 14, 15]
for valor in lista:
    print(valor)
# imprime: 10 11 12 13 14 15</pre>
<p>O comando <code>range</code> cria uma lista de valores iniciada em 0 por padrão:</p>
<pre>for valor in range(5):
    print(valor)
# imprime: 0 1 2 3 4

for valor in range(4, 8):
    print(valor)
# imprime: 4 5 6 7</pre>

<h3>3.1 Cálculo do fatorial de um número</h3>
<p>O fatorial de um número é o produto de todos os números decrescentes até 1: n! = n·(n−1)·(n−2)···1. Exemplo: 3! = 3·2·1 = 6.</p>
<pre>numero = int(input("Digite o número que se deseja determinar o fatorial: "))

for termo in range(1, (numero + 1)):
    fatorial *= termo
print("O fatorial de " + str(numero) + "! é : " + str(fatorial))

# O fatorial de 3! é : 6</pre>
<p>O <code>range</code> começa em 1 (não em 0) para que a multiplicação não seja zerada por um termo 0. Usa-se o operador composto <code>*=</code> para multiplicar fatorial por cada termo, e <code>int()</code> converte a entrada do usuário para número inteiro.</p>
<h3>3.2 Soma de duas listas</h3>
<p>Uma lista numérica pode ser somada a outra de igual dimensão, elemento a elemento. Exemplo: A = [2, 3, 4] e B = [7, −3, 2] → A + B = [(2+7), (3+(−3)), (4+2)] = [9, 0, 6].</p>
<pre>A = [2, 3, 4]
B = [7, -3, 2]
C = []
for indice in range(3):
    C.append(A[indice] + B[indice])
print(C)
# [9, 0, 6]</pre>
<p>A variável <code>índice</code>, junto com <code>range</code>, é usada para acessar a posição correspondente em cada lista; a lista <code>C</code> é alimentada com o resultado de cada soma via <code>.append</code>.</p>
<h3>3.3 Encontrando números primos</h3>
<p>Número primo é todo aquele divisível apenas por 1 e por si mesmo (ex.: 7). Números primos são essenciais para algoritmos de criptografia.</p>
<pre>numPrimos = []

let STATE = loadState();
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    const base = defaultState();
    // merge to tolerate schema growth
    base.xp = parsed.xp||0;
    Object.keys(base.levels).forEach(id=>{
      if(parsed.levels && parsed.levels[id]) Object.assign(base.levels[id], parsed.levels[id]);
    });
    if(parsed.boss) Object.assign(base.boss, parsed.boss);
    return base;
  }catch(e){ return defaultState(); }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function sampleN(arr, n){ return shuffle(arr).slice(0, n); }
function escapeHTML(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function normalizeText(s){
  return s.toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/\s+/g,' ')
    .trim();
}
function groupPresent(normalizedText, group){
  return group.synonyms.some(syn=>{
    const s = normalizeText(syn);
    if(!s) return false;
    if(s.length<=3 && !/\s/.test(s)){
      const re = new RegExp('(^|[^a-z0-9])'+s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'([^a-z0-9]|$)','i');
      return re.test(normalizedText);
    }
    return normalizedText.includes(s);
  });
}
function gradeDiscursive(raw, spec){
  const text = normalizeText(raw||'');
  if(text.length<15){
    return {approved:false, tooShort:true, missingLabels:[], presentCount:0};
  }
  const missingLabels=[];
  let presentCount=0;
  spec.groups.forEach(g=>{
    if(groupPresent(text,g)) presentCount++; else missingLabels.push(g.label);
  });
  return {approved: presentCount>=spec.threshold, tooShort:false, missingLabels, presentCount};
}
function worldOf(levelId){
  const lv = LEVELS.find(l=>l.id===levelId);
  return lv? lv.world : null;
}

      const unlocked = isLevelUnlocked(l.idx);
      let statusBadge = '';
      let cls = 'level-card';
      if(!unlocked){ cls+=' locked'; statusBadge = '<span class="badge badge-lock">🔒 Bloqueado</span>'; }
      else if(st.completed){ cls+=' completed'; statusBadge = `<span class="badge badge-ok">✓ ${st.quizBestPct}%</span>`; }
      else { cls+=' available'; statusBadge = '<span class="badge" style="background:rgba(255,255,255,.06);color:'+w.color+'">Disponível</span>'; }
      html += `<button class="${cls}" style="--accent:${w.color}" ${unlocked?`onclick="goLevel('${l.id}')"`:'disabled'}>
        <div class="lv-top"><span class="lv-num">Nível ${l.idx+1}</span>${statusBadge}</div>
        <div class="lv-title">${escapeHTML(l.title)}</div>
        <div class="lv-status">${l.subtitle||''}</div>
      </button>`;
    });
    html += '</div></div>';
  });

  const bossUnlocked = STATE.boss.unlocked;
  html += `<div class="boss-card">
    <h2>${bossUnlocked?'🏆':'🔒'} Desafio Final</h2>
    <p>20 questões sorteadas do banco (balanceadas por mundo) + 2 discursivas integradoras. Aprovação: ≥16/20 e as 2 discursivas.</p>
    ${STATE.boss.completed?`<p style="color:var(--ok);font-weight:700;">Treinamento concluído! Melhor resultado: ${STATE.boss.bestObjective}/20</p>`:''}
    <button class="btn btn-primary" ${bossUnlocked?'':'disabled'} onclick="goBoss('intro')">
      ${bossUnlocked? (STATE.boss.completed? 'Refazer Desafio Final' : 'Iniciar Desafio Final') : 'Complete os 11 níveis para destravar'}
    </button>
  </div>`;

  html += `<div class="reset-row"><button onclick="confirmReset()">Reiniciar progresso</button></div>`;

  app.innerHTML = html;
}

function confirmReset(){
  showModal({
    title:'Reiniciar progresso?',
    body:'Isso vai apagar todo o XP, níveis concluídos e o estado do Desafio Final. Essa ação não pode ser desfeita.',
    confirmLabel:'Sim, continuar',
    onConfirm: ()=> showModal({
      title:'Tem certeza mesmo?',
      body:'Confirme novamente para apagar TODO o progresso salvo neste dispositivo.',
      confirmLabel:'Apagar tudo',
      danger:true,
      onConfirm: ()=>{ STATE = defaultState(); saveState(); closeModal(); goMap(); }
    })
  });
}
function showModal({title, body, confirmLabel, onConfirm, danger}){
  closeModal();
  const bg = document.createElement('div');
  bg.className='modal-bg'; bg.id='modal-bg';
  bg.innerHTML = `<div class="modal">
    <h3>${escapeHTML(title)}</h3>
    <p style="color:var(--text-dim);">${escapeHTML(body)}</p>
    <div class="btn-row">
      <button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn ${danger?'btn-danger':'btn-primary'}" id="modal-confirm">${escapeHTML(confirmLabel)}</button>
    </div>
  </div>`;
  document.body.appendChild(bg);
  document.getElementById('modal-confirm').onclick = onConfirm;
}
function closeModal(){ const m=document.getElementById('modal-bg'); if(m) m.remove(); }

/* ======================= LEVEL VIEW ======================= */
let QUIZ_RUNTIME = null; // {questions:[...], idx, answers:[]}
let DISC_RUNTIME_TEXT = '';

function currentLevel(){ return LEVELS.find(l=>l.id===ROUTE.levelId); }

function renderLevelView(){
  const lv = currentLevel();
  const w = worldMeta(lv.world);
  const st = STATE.levels[lv.id];
  const stages = ['didactic','technical','quiz','discursive'];
  const stageLabels = {didactic:'1. Didática', technical:'2. Técnica', quiz:'3. Quiz', discursive:'4. Discursiva'};

  let tabsHtml = '<div class="stage-tabs">';
  stages.forEach(s=>{
    let cls='stage-tab';
    if(s===ROUTE.stage) cls+=' active';
    tabsHtml += `<div class="${cls}">${stageLabels[s]}</div>`;
  });
  tabsHtml += '</div>';

  let body = '';
  if(ROUTE.stage==='didactic') body = renderDidactic(lv);
  else if(ROUTE.stage==='technical') body = renderTechnical(lv);
  else if(ROUTE.stage==='quiz') body = renderQuizStage(lv);
  else if(ROUTE.stage==='discursive') body = renderDiscursiveStage(lv);

  app.innerHTML = `
    <div style="--accent:${w.color}">
      <div class="level-header">
        <div class="eyebrow" style="color:${w.color}">${escapeHTML(w.name)}</div>
        <h1>${escapeHTML(lv.title)}</h1>
      </div>
      ${tabsHtml}
      ${body}
    </div>
  `;
}

function renderDidactic(lv){
  return `<div class="card">
    <h2>🧩 Em bom português</h2>
    ${lv.didactic}
    <div class="btn-row"><button class="btn btn-primary" onclick="goLevel('${lv.id}','technical')">Ir para a parte técnica →</button></div>
  </div>`;
}
function renderTechnical(lv){
  return `<div class="card">
    <h2>📘 Conteúdo técnico (apostila)</h2>
    ${lv.technical}
    <div class="btn-row">
      <button class="btn" onclick="goLevel('${lv.id}','didactic')">← Rever analogia</button>
      <button class="btn btn-primary" onclick="goLevel('${lv.id}','quiz')">Ir para o quiz →</button>
    </div>
  </div>`;
}

function startQuiz(levelId){
  const lv = LEVELS.find(l=>l.id===levelId);
  const qs = shuffle(lv.quiz).map(q=>{
    const optOrder = shuffle(q.options.map((opt,i)=>({opt,correct:i===q.correct})));
    return {
      statement:q.statement,
      justification:q.justification,
      options: optOrder.map(o=>o.opt),
      correctIdx: optOrder.findIndex(o=>o.correct),
    };
  });
  QUIZ_RUNTIME = {levelId, boss:false, questions:qs, idx:0, answers:new Array(qs.length).fill(null)};
  ROUTE = {view:'level', levelId, stage:'quiz'};
  render();
}

function renderQuizStage(lv){
  if(!QUIZ_RUNTIME || QUIZ_RUNTIME.levelId!==lv.id || QUIZ_RUNTIME.done){
    return `<div class="card">
      <h2>❓ Quiz — ${lv.quiz.length} questões</h2>
      <p>Aprovação com pelo menos ${passThreshold(lv.quiz.length)} acertos (≥80%). Uma questão por vez, sem feedback até o final. Cada tentativa embaralha perguntas e alternativas.</p>
      <div class="btn-row">
        <button class="btn" onclick="goLevel('${lv.id}','technical')">← Rever conteúdo técnico</button>
        <button class="btn btn-primary" onclick="startQuiz('${lv.id}')">Começar quiz</button>
      </div>
    </div>`;
  }
  if(QUIZ_RUNTIME.finished) return renderQuizResult(lv);
  const q = QUIZ_RUNTIME.questions[QUIZ_RUNTIME.idx];
  const selected = QUIZ_RUNTIME.answers[QUIZ_RUNTIME.idx];
  let optsHtml = '';
  q.options.forEach((opt,i)=>{
    optsHtml += `<button class="opt ${selected===i?'selected':''}" onclick="selectQuizOption(${i})">
      <b>${String.fromCharCode(65+i)}</b>${escapeHTML(opt)}
    </button>`;
  });
  return `<div class="card">
    <div class="quiz-progress">Questão ${QUIZ_RUNTIME.idx+1} de ${QUIZ_RUNTIME.questions.length}</div>
    <div class="quiz-q">${escapeHTML(q.statement)}</div>
    ${optsHtml}
    <div class="btn-row">
      ${QUIZ_RUNTIME.idx>0?`<button class="btn" onclick="quizNav(-1)">← Anterior</button>`:''}
      <button class="btn btn-primary" ${selected==null?'disabled':''} onclick="quizNav(1)">
        ${QUIZ_RUNTIME.idx===QUIZ_RUNTIME.questions.length-1?'Ver resultado':'Próxima →'}
      </button>
    </div>
  </div>`;
}
function selectQuizOption(i){
  QUIZ_RUNTIME.answers[QUIZ_RUNTIME.idx]=i;
  renderLevelViewOrBoss();
}
function quizNav(dir){
  if(dir>0 && QUIZ_RUNTIME.idx===QUIZ_RUNTIME.questions.length-1){
    QUIZ_RUNTIME.finished = true;
  } else {
    QUIZ_RUNTIME.idx += dir;
  }
  renderLevelViewOrBoss();
}
function renderLevelViewOrBoss(){
  if(ROUTE.view==='boss') renderBossView(); else renderLevelView();
}

function passThreshold(n){ return Math.ceil(n*0.8); }

function renderQuizResult(lv){
  const total = QUIZ_RUNTIME.questions.length;
  let correct = 0;
  const reviews = [];
  QUIZ_RUNTIME.questions.forEach((q,i)=>{
    const ans = QUIZ_RUNTIME.answers[i];
    const ok = ans===q.correctIdx;
    if(ok) correct++;
    else reviews.push({q, ans});
  });
  const pct = Math.round(100*correct/total);
  const need = passThreshold(total);
  const passed = correct>=need;
  const st = STATE.levels[lv.id];

  if(!QUIZ_RUNTIME.scored){
    QUIZ_RUNTIME.scored = true;
    st.quizAttempts += 1;
    st.quizBestPct = Math.max(st.quizBestPct, pct);
    if(passed){
      st.quizPassed = true;
      if(st.quizAttempts===1 && correct===total) st.firstTry100 = true;
    }
    saveState();
  }

  let reviewHtml = '';
  if(reviews.length){
    reviewHtml += '<h3 style="margin-top:26px;">Questões para revisar</h3>';
    reviews.forEach(({q,ans})=>{
      reviewHtml += `<div class="review-item">
        <div class="rq">${escapeHTML(q.statement)}</div>
        <div class="ra wrong">Sua resposta: ${ans==null?'(em branco)':escapeHTML(q.options[ans])}</div>
        <div class="ra right">Correta: ${escapeHTML(q.options[q.correctIdx])}</div>
        <div class="why">${escapeHTML(q.justification)}</div>
      </div>`;
    });
  }

  return `<div class="card">
    <div class="result-summary">
      <div class="score">${correct}/${total}</div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Aprovado! ✓':'Não atingiu 80% — tente de novo'}</div>
    </div>
    ${reviewHtml}
    <div class="btn-row">
      <button class="btn" onclick="startQuiz('${lv.id}')">🔀 Refazer quiz</button>
      ${passed?`<button class="btn btn-primary" onclick="QUIZ_RUNTIME=null; goLevel('${lv.id}','discursive')">Ir para a discursiva →</button>`:''}
    </div>
  </div>`;
}

function renderDiscursiveStage(lv){
  const st = STATE.levels[lv.id];
  if(!st.quizPassed){
    return `<div class="card"><h2>✍️ Discursiva</h2><p>Você precisa ser aprovado no quiz antes de responder a discursiva.</p>
      <div class="btn-row"><button class="btn btn-primary" onclick="goLevel('${lv.id}','quiz')">Ir para o quiz</button></div></div>`;
  }
  const spec = lv.discursive;
  let feedback = '';
  if(DISC_RUNTIME_TEXT.__result){
    const r = DISC_RUNTIME_TEXT.__result;
    if(r.approved){
      feedback = `<div class="feedback-box good">✅ Resposta aprovada! Sua explicação cobre os conceitos essenciais.</div>
        <div class="model-answer"><strong>Resposta-modelo (apostila):</strong><br>${spec.model}</div>
        <div class="btn-row"><button class="btn btn-primary" onclick="completeLevel('${lv.id}')">Concluir Nível ✓</button></div>`;
    } else if(r.tooShort){
      feedback = `<div class="feedback-box bad">Sua resposta é muito curta. Elabore um pouco mais (mínimo 15 caracteres).</div>`;
    } else {
      feedback = `<div class="feedback-box bad">Sua resposta ainda não cobre: ${r.missingLabels.map(escapeHTML).join(', ')}.</div>`;
    }
  }
  return `<div class="card">
    <h2>✍️ Discursiva</h2>
    <p>${escapeHTML(spec.question)}</p>
    <textarea id="disc-input" placeholder="Escreva sua resposta com suas próprias palavras...">${escapeHTML(DISC_RUNTIME_TEXT.text||'')}</textarea>
    ${feedback}
    <div class="btn-row">
      <button class="btn btn-primary" onclick="submitDiscursive('${lv.id}')">Enviar resposta</button>
    </div>
  </div>`;
}
function submitDiscursive(levelId){
  const lv = LEVELS.find(l=>l.id===levelId);
  const text = document.getElementById('disc-input').value;
  const result = gradeDiscursive(text, lv.discursive);
  DISC_RUNTIME_TEXT = {text, __result:result};
  renderLevelView();
}
function completeLevel(levelId){
  const lv = LEVELS.find(l=>l.id===levelId);
  const st = STATE.levels[lv.id];
  st.discursivePassed = true;
  const wasCompleted = st.completed;
  st.completed = true;
  saveState();
  DISC_RUNTIME_TEXT = '';
  if(!wasCompleted){
    let xp = 100;
    if(st.firstTry100) xp += 20;
    awardXP(xp, st.firstTry100? 'Nível concluído (quiz perfeito!)':'Nível concluído');
  }
  refreshBossUnlock(); saveState();
  goMap();
}

/* ======================= BOSS ======================= */
let BOSS_RUNTIME = null;

function poolByWorld(){
  const pools = {w1:[],w2:[],w3:[],w4:[]};
  LEVELS.forEach(lv=>{
    lv.quiz.forEach(q=>{
      pools[lv.world].push({...q, sourceLevelId: lv.id, sourceLevelTitle: lv.title});
    });
  });
  return pools;
}

function renderBossView(){
  const w = {color:'#e07be0'};
  if(ROUTE.stage==='intro'){
    app.innerHTML = `<div style="--accent:#c46bd8">
      <div class="level-header"><div class="eyebrow" style="color:#c46bd8">Desafio Final</div><h1>Boss: Prova Geral</h1></div>
      <div class="card">
        <p>20 questões sorteadas do banco de 67 (6 do Mundo 1, 5 do Mundo 2, 5 do Mundo 3, 4 do Mundo 4) + 2 discursivas integradoras.</p>
        <p>Aprovação: pelo menos 16/20 nas objetivas <strong>e</strong> as 2 discursivas aprovadas. Alternativas e sorteio são novos a cada tentativa.</p>
        <div class="btn-row">
          <button class="btn" onclick="goMap()">← Mapa</button>
          <button class="btn btn-primary" onclick="startBoss()">Começar Desafio Final</button>
        </div>
      </div>
    </div>`;
    return;
  }
  if(ROUTE.stage==='quiz') return renderBossQuiz();
  if(ROUTE.stage==='discursive') return renderBossDiscursive();
  if(ROUTE.stage==='diagnosis') return renderBossDiagnosis();
}

function startBoss(){
  const pools = poolByWorld();
  const picked = [
    ...sampleN(pools.w1, BOSS.worldQuota.w1),
    ...sampleN(pools.w2, BOSS.worldQuota.w2),
    ...sampleN(pools.w3, BOSS.worldQuota.w3),
    ...sampleN(pools.w4, BOSS.worldQuota.w4),
  ];
  const qs = shuffle(picked).map(q=>{
    const optOrder = shuffle(q.options.map((opt,i)=>({opt,correct:i===q.correct})));
    return {
      statement:q.statement, justification:q.justification,
      world: worldOf(q.sourceLevelId), sourceLevelId:q.sourceLevelId, sourceLevelTitle:q.sourceLevelTitle,
      options: optOrder.map(o=>o.opt),
      correctIdx: optOrder.findIndex(o=>o.correct),
    };
  });
  BOSS_RUNTIME = {questions:qs, idx:0, answers:new Array(qs.length).fill(null), finished:false,
    discIdx:0, discTexts:['',''], discResults:[null,null]};
  ROUTE = {view:'boss', stage:'quiz'};
  render();
}

function renderBossQuiz(){
  if(!BOSS_RUNTIME) return startBoss();
  if(BOSS_RUNTIME.finished) return renderBossQuizResult();
  const q = BOSS_RUNTIME.questions[BOSS_RUNTIME.idx];
  const selected = BOSS_RUNTIME.answers[BOSS_RUNTIME.idx];
  let optsHtml='';
  q.options.forEach((opt,i)=>{
    optsHtml += `<button class="opt ${selected===i?'selected':''}" onclick="selectBossOption(${i})">
      <b>${String.fromCharCode(65+i)}</b>${escapeHTML(opt)}
    </button>`;
  });
  return renderInto(`<div style="--accent:#c46bd8">
    <div class="level-header"><div class="eyebrow" style="color:#c46bd8">Desafio Final</div><h1>Prova Geral</h1></div>
    <div class="card">
      <div class="quiz-progress">Questão ${BOSS_RUNTIME.idx+1} de ${BOSS_RUNTIME.questions.length}</div>
      <div class="quiz-q">${escapeHTML(q.statement)}</div>
      ${optsHtml}
      <div class="btn-row">
        ${BOSS_RUNTIME.idx>0?`<button class="btn" onclick="bossQuizNav(-1)">← Anterior</button>`:''}
        <button class="btn btn-primary" ${selected==null?'disabled':''} onclick="bossQuizNav(1)">
          ${BOSS_RUNTIME.idx===BOSS_RUNTIME.questions.length-1?'Ver resultado':'Próxima →'}
        </button>
      </div>
    </div>
  </div>`);
}
function selectBossOption(i){ BOSS_RUNTIME.answers[BOSS_RUNTIME.idx]=i; renderBossView(); }
function bossQuizNav(dir){
  if(dir>0 && BOSS_RUNTIME.idx===BOSS_RUNTIME.questions.length-1) BOSS_RUNTIME.finished=true;
  else BOSS_RUNTIME.idx += dir;
  renderBossView();
}
function renderBossQuizResult(){
  let correct=0;
  const perWorld = {w1:{correct:0,total:0,wrongLevels:new Set()}, w2:{correct:0,total:0,wrongLevels:new Set()},
                     w3:{correct:0,total:0,wrongLevels:new Set()}, w4:{correct:0,total:0,wrongLevels:new Set()}};
  const reviews = [];
  BOSS_RUNTIME.questions.forEach((q,i)=>{
    const ans = BOSS_RUNTIME.answers[i];
    const ok = ans===q.correctIdx;
    perWorld[q.world].total++;
    if(ok){ correct++; perWorld[q.world].correct++; }
    else { perWorld[q.world].wrongLevels.add(q.sourceLevelTitle); reviews.push({q,ans}); }
  });
  BOSS_RUNTIME.perWorld = perWorld;
  BOSS_RUNTIME.correctCount = correct;
  if(!BOSS_RUNTIME.scored){
    BOSS_RUNTIME.scored = true;
    STATE.boss.attempts += 1;
    STATE.boss.bestObjective = Math.max(STATE.boss.bestObjective, correct);
    STATE.boss.objectivePassed = correct>=16;
    saveState();
  }
  const passed = correct>=16;
  let reviewHtml='';
  if(reviews.length){
    reviewHtml += '<h3 style="margin-top:22px;">Questões para revisar</h3>';
    reviews.forEach(({q,ans})=>{
      reviewHtml += `<div class="review-item">
        <div class="rq">${escapeHTML(q.statement)}</div>
        <div class="ra wrong">Sua resposta: ${ans==null?'(em branco)':escapeHTML(q.options[ans])}</div>
        <div class="ra right">Correta: ${escapeHTML(q.options[q.correctIdx])}</div>
        <div class="why">${escapeHTML(q.justification)} <em>(origem: ${escapeHTML(q.sourceLevelTitle)})</em></div>
      </div>`;
    });
  }
  return renderInto(`<div style="--accent:#c46bd8">
    <div class="level-header"><div class="eyebrow" style="color:#c46bd8">Desafio Final</div><h1>Resultado das Objetivas</h1></div>
    <div class="card">
      <div class="result-summary">
        <div class="score">${correct}/20</div>
        <div class="verdict ${passed?'pass':'fail'}">${passed?'≥16 acertos! ✓':'Abaixo de 16 — precisa melhorar'}</div>
      </div>
      ${reviewHtml}
      <div class="btn-row">
        <button class="btn" onclick="startBoss()">🔀 Refazer objetivas (novo sorteio)</button>
        <button class="btn" onclick="ROUTE={view:'boss',stage:'diagnosis'};render();">Ver diagnóstico por mundo</button>
        <button class="btn btn-primary" onclick="ROUTE={view:'boss',stage:'discursive'};render();">Ir para as discursivas →</button>
      </div>
    </div>
  </div>`);
}
function renderInto(html){ app.innerHTML = html; }

function renderBossDiagnosis(){
  const pw = BOSS_RUNTIME && BOSS_RUNTIME.perWorld;
  let html = `<div style="--accent:#c46bd8">
    <div class="level-header"><div class="eyebrow" style="color:#c46bd8">Desafio Final</div><h1>Diagnóstico por Mundo</h1></div>
    <div class="card">`;
  if(!pw){
    html += '<p>Faça as objetivas do Desafio Final primeiro.</p>';
  } else {
    WORLDS.forEach(w=>{
      const d = pw[w.id];
      html += `<div class="diag-world" style="border-color:${w.color}44">
        <div class="dw-head"><span>${escapeHTML(w.name)}</span><span style="color:${w.color}">${d.correct}/${d.total}</span></div>
        ${d.wrongLevels.size? `<div class="dw-revise">Revisar: ${Array.from(d.wrongLevels).map(escapeHTML).join(', ')}</div>` : '<div class="dw-revise" style="color:var(--ok)">Sem erros neste mundo 👍</div>'}
      </div>`;
    });
  }
  html += `<div class="btn-row">
    <button class="btn" onclick="goMap()">← Mapa</button>
    <button class="btn btn-primary" onclick="ROUTE={view:'boss',stage:'discursive'};render();">Ir para as discursivas →</button>
  </div></div></div>`;
  app.innerHTML = html;
}

function renderBossDiscursive(){
  if(!BOSS_RUNTIME){ ROUTE={view:'boss',stage:'intro'}; return render(); }
  const i = BOSS_RUNTIME.discIdx;
  if(i>=2) return renderBossFinal();
  const spec = BOSS.discursives[i];
  const result = BOSS_RUNTIME.discResults[i];
  let feedback='';
  if(result){
    if(result.approved){
      feedback = `<div class="feedback-box good">✅ Resposta aprovada!</div>
        <div class="model-answer"><strong>Resposta-modelo:</strong><br>${spec.model}</div>
        <div class="btn-row"><button class="btn btn-primary" onclick="bossDiscNext()">${i===1?'Ver resultado final →':'Próxima discursiva →'}</button></div>`;
    } else if(result.tooShort){
      feedback = `<div class="feedback-box bad">Resposta muito curta. Elabore mais.</div>`;
    } else {
      feedback = `<div class="feedback-box bad">Sua resposta ainda não cobre: ${result.missingLabels.map(escapeHTML).join(', ')}.</div>`;
    }
  }
  return renderInto(`<div style="--accent:#c46bd8">
    <div class="level-header"><div class="eyebrow" style="color:#c46bd8">Desafio Final</div><h1>Discursiva integradora ${i+1}/2</h1></div>
    <div class="card">
      <p>${escapeHTML(spec.question)}</p>
      <textarea id="boss-disc-input" placeholder="Escreva sua resposta...">${escapeHTML(BOSS_RUNTIME.discTexts[i]||'')}</textarea>
      ${feedback}
      <div class="btn-row"><button class="btn btn-primary" onclick="submitBossDiscursive(${i})">Enviar resposta</button></div>
    </div>
  </div>`);
}
function submitBossDiscursive(i){
  const text = document.getElementById('boss-disc-input').value;
  const spec = BOSS.discursives[i];
  const result = gradeDiscursive(text, spec);
  BOSS_RUNTIME.discTexts[i] = text;
  BOSS_RUNTIME.discResults[i] = result;
  renderBossView();
}
function bossDiscNext(){
  BOSS_RUNTIME.discIdx += 1;
  renderBossView();
}
function renderBossFinal(){
  const objPassed = BOSS_RUNTIME.correctCount>=16;
  const discPassed = BOSS_RUNTIME.discResults.every(r=>r&&r.approved);
  const passed = objPassed && discPassed;
  if(passed && !STATE.boss.completed){
    STATE.boss.completed = true;
    saveState();
    awardXP(300, 'Desafio Final concluído!');
  } else if(passed){
    saveState();
  }
  const totalLevelXP = LEVELS.reduce((s,lv)=>{
    const st = STATE.levels[lv.id];
    return s + (st.completed? (100+(st.firstTry100?20:0)) : 0);
  },0);
  app.innerHTML = `<div style="--accent:#c46bd8">
    <div class="level-header"><div class="eyebrow" style="color:#c46bd8">Desafio Final</div><h1>${passed?'🏆 Treinamento Concluído!':'Resultado do Desafio Final'}</h1></div>
    <div class="card">
      <div class="result-summary">
        <div class="score">${BOSS_RUNTIME.correctCount}/20</div>
        <div class="verdict ${passed?'pass':'fail'}">${passed?'Aprovado no Desafio Final! ✓':(objPassed?'Objetivas OK, revise as discursivas':'Não atingiu os critérios — tente novamente')}</div>
      </div>
      <p style="text-align:center;color:var(--text-dim);">XP total acumulado: <strong>${totalXP()} XP</strong> (${totalLevelXP} XP dos níveis${STATE.boss.completed?' + 300 XP do Desafio Final':''})</p>
      ${passed?'<p style="text-align:center;">Você concluiu os 4 mundos, 11 níveis e o Desafio Final da disciplina Algoritmo e Lógica de Programação. Bons estudos para a prova!</p>':''}
      <div class="btn-row">
        <button class="btn" onclick="ROUTE={view:'boss',stage:'diagnosis'};render();">Ver diagnóstico por mundo</button>
        <button class="btn" onclick="startBoss()">🔀 Tentar novamente</button>
        <button class="btn btn-primary" onclick="goMap()">← Voltar ao mapa</button>
      </div>
    </div>
  </div>`;
}

render();
</script>
